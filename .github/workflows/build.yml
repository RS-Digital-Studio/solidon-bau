  linux-flatpak:
    name: Flatpak (ubuntu-24.04)
    needs: [quelle, package]
    if: inputs.tests_only != true && (startsWith(github.event.inputs.ref, 'refs/tags/') || github.event.inputs.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Linux-Baum laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-linux-release-input
          path: ${{ runner.temp }}/solidon-ci/loaded/01
      - name: Linux-Baum laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-linux-release-input
          SOLIDON_TARGET: linux-input
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/01" --target "$SOLIDON_TARGET"
      - name: Gebauten Baum auspacken
        shell: python
        env:
          SOLIDON_STEP_NAME: "Gebauten Baum auspacken"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          archive=$(find linux-input -maxdepth 1 -type f -name 'Solidon3D-*-linux-x86_64.tar.gz')
          [ -n "$archive" ] && [ -f "$archive.sha256" ]
          [ "$(sha256sum "$archive" | awk '{print $1}')" = "$(awk '{print $1}' "$archive.sha256")" ] || { echo "Geändertes Linux-Archiv."; exit 1; }
          while IFS= read -r entry; do
            trimmed=${entry%/}
            case "/$trimmed/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$trimmed" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(tar -tzf "$archive")
          mkdir -p unpacked dist
          tar -xzf "$archive" -C unpacked
          tree=$(find unpacked -mindepth 2 -maxdepth 2 -type d -name Solidon3D)
          [ -n "$tree" ] || { echo "Solidon3D-App-Baum fehlt im Linux-Archiv."; exit 1; }
          mv "$tree" dist/Solidon3D
          python tools/check_glibc_floor.py dist/Solidon3D
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '02', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Paketierwerkzeuge holen (Flatpak)
        shell: python
        env:
          SOLIDON_STEP_NAME: "Paketierwerkzeuge holen (Flatpak)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common xvfb xauth
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          # Welche Flatpak-Fassung die Laufzeit voraussetzt (Website: „jede
          # Distribution mit Flatpak“) — gelesen statt behauptet.
          echo "Flatpak des Bauservers: $(flatpak --version)"
          flatpak info --user --show-metadata org.freedesktop.Platform//26.08 | grep -i 'required-flatpak' || echo "Die Laufzeit 26.08 nennt keine Mindestfassung von Flatpak."
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Flatpak bauen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Flatpak bauen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/make_linux_packages.py --flatpak
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Flatpak starten
        timeout-minutes: 20
        shell: python
        env:
          SOLIDON_STEP_NAME: "Flatpak starten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          app_id=$(python -c "from app.branding import APP_ID; print(APP_ID)")
          flatpak install --user -y --noninteractive "$(ls dist/*.flatpak)"
          dbus-run-session -- xvfb-run -a --server-args="-screen 0 1920x1080x24" python tools/check_frozen_start.py --flatpak "$app_id"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '05', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Prüfsumme (Flatpak)
        shell: python
        env:
          SOLIDON_STEP_NAME: "Prüfsumme (Flatpak)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          cd dist
          for bundle in *.flatpak; do sha256sum "$bundle" | tee "$bundle.sha256"; done
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '06', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Flatpak intern übergeben (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-linux-flatpak-input
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/07" <<'SOLIDON_PATHS'
          dist/*.flatpak
          dist/*.flatpak.sha256
          SOLIDON_PATHS
      - name: Flatpak intern übergeben
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-linux-flatpak-input
          path: ${{ runner.temp }}/solidon-ci/boxes/07/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-linux-flatpak-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-linux-flatpak-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  linux-release-start:
    name: AppImage starten (${{ matrix.os }})
    needs: [quelle, package]
    if: inputs.tests_only != true && (startsWith(github.event.inputs.ref, 'refs/tags/') || github.event.inputs.event == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Grafik und Bildschirm des Prüfrechners
        shell: python
        env:
          SOLIDON_STEP_NAME: "Grafik und Bildschirm des Prüfrechners"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libvulkan1 mesa-vulkan-drivers xvfb xauth
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: AppImage laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-linux-release-input
          path: ${{ runner.temp }}/solidon-ci/loaded/02
      - name: AppImage laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-linux-release-input
          SOLIDON_TARGET: linux-input
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/02" --target "$SOLIDON_TARGET"
      - name: AppImage auf frischem System starten
        timeout-minutes: 20
        shell: python
        env:
          SOLIDON_STEP_NAME: "AppImage auf frischem System starten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          appimage=$(find linux-input -maxdepth 1 -type f -name '*.AppImage')
          [ -n "$appimage" ] && [ -f "$appimage.sha256" ]
          [ "$(sha256sum "$appimage" | awk '{print $1}')" = "$(awk '{print $1}' "$appimage.sha256")" ] || { echo "Geändertes AppImage."; exit 1; }
          chmod +x "$appimage"
          echo "glibc des Prüfrechners: $(ldd --version | sed -n 1p)"
          # Die libstdc++ kommt vom Rechner. Trägt der Läufer eine neuere aus
          # einer Toolchain-Quelle, verdeckte sie ein zu neues GLIBCXX im
          # Paket; die Obergrenze hält check_glibc_floor ohnehin statisch.
          cxx=$(ldconfig -p | awk '/libstdc\+\+\.so\.6 .*x86-64/ && !found {print $NF; found = 1}')
          echo "libstdc++ des Prüfrechners: $cxx, höchstens $(grep -ao 'GLIBCXX_3\.4\.[0-9]*' "$cxx" | sort -uV | tail -n 1)"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python tools/check_frozen_start.py --executable "$appimage"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-linux-release-start-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-linux-release-start-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

