        shell: python
        env:
          SOLIDON_STEP_NAME: "Sammelwerkzeug"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -c constraints.txt pytest
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Auswahl aus dem Auftrag
        id: selection
        shell: python
        env:
          SOLIDON_STEP_NAME: "Auswahl aus dem Auftrag"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          python tools/ci_selection.py --order "$SOLIDON_ORDER" >> "$GITHUB_OUTPUT"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '02', '--shell', 'bash']
