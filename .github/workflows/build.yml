          cache: pip
      - name: Qt-Systembibliotheken
        shell: python
        env:
          SOLIDON_STEP_NAME: "Qt-Systembibliotheken"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 xvfb xauth \
            libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            fonts-dejavu-core fontconfig \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-glx0
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: PHP für die Endpunkttests (Linux)
        shell: python
        env:
          SOLIDON_STEP_NAME: "PHP für die Endpunkttests (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          sudo apt-get install -y --no-install-recommends php-cli php-sqlite3 php-mbstring php-curl
          php -r 'foreach (["sodium", "pdo_sqlite", "mbstring", "curl"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("PHP-Erweiterung fehlt: " . $extension); } }'
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '02', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Abhängigkeiten ohne Constraints
        shell: python
        env:
          SOLIDON_STEP_NAME: "Abhängigkeiten ohne Constraints"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -e ".[dev,geom,ui,brep]"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Schichtkern mit den neuesten Bauabhängigkeiten
        shell: python
        env:
          SOLIDON_STEP_NAME: "Schichtkern mit den neuesten Bauabhängigkeiten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/build_slice_core.py
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Installierte Versionen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Installierte Versionen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip freeze --exclude-editable
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '05', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Stil und Typen
        id: style
        shell: python
        env:
          SOLIDON_STEP_NAME: "Stil und Typen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '06', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Tests
        id: tests
        if: success() || steps.style.outcome == 'failure'
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          SOLIDON_STEP_NAME: "Tests"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          mkdir -p reports/latest
          run() { xvfb-run -a --server-args="-screen 0 1920x1080x24" python -m pytest -q "$@"; }
          run -n auto -m "not performance and not rendered and not windowed and not rendering" --durations=30 --durations-min=1 --junitxml=reports/latest/junit.xml
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '07', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Fensterverträge und Rendererfälle
        if: (success() || steps.style.outcome == 'failure' || steps.tests.outcome == 'failure') && inputs.tests_only != true
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          SOLIDON_STEP_NAME: "Fensterverträge und Rendererfälle"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python tools/run_suite_isolated.py --release --ci-group contracts --ci-group rendering --report-dir reports/latest
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '08', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Versionsprüfbericht sichern (verschließen)
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: tests-latest-ubuntu
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/09" <<'SOLIDON_PATHS'
          reports/latest/
          SOLIDON_PATHS
      - name: Versionsprüfbericht sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-latest-ubuntu
          path: ${{ runner.temp }}/solidon-ci/boxes/09/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-latest-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-latest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
