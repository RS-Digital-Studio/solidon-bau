            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-macos-minimum-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  package:
    name: Paket (${{ matrix.os }})
    needs: [quelle, quality, suite, window-contracts, windows, linux-keyring, macos-minimum]
    if: inputs.tests_only != true && (startsWith(github.event.inputs.ref, 'refs/tags/') || github.event.inputs.event == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
      - name: Signiermodus fail-closed prüfen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Signiermodus fail-closed prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          if ($env:MACOS_SIGNING_MODE -notin @('signed', 'notarized', 'unsigned')) { throw "MACOS_SIGNING_MODE muss signed, notarized oder unsigned sein." }
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Qt-Systembibliotheken (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          sudo apt-get update
          # Die xcb-util-Bibliotheken und xkbcommon-x11: Qts X11-Plugin hängt
          # hart an ihnen, PyInstaller bündelt nur, was der Runner hat — und der
          # hatte sie nicht. Auf einem Ubuntu-GNOME fehlt libxcb-cursor0
          # regelmäßig, und Qt startet dann nicht (make_sbom.LINUX_LIBRARY_FAMILIES).
          # ``libvulkan1`` und ``mesa-vulkan-drivers``: Die Ansicht zeichnet
          # über wgpu, und der Paketlauf soll auf demselben Boden stehen wie
          # der Testlauf darüber. ``xvfb`` und ``xauth`` für den Starttest
          # der fertigen Pakete.
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 pkg-config \
            libvulkan1 mesa-vulkan-drivers xvfb xauth \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '02', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Abhängigkeiten
        shell: python
        env:
          SOLIDON_STEP_NAME: "Abhängigkeiten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -c constraints.txt -e ".[geom,ui,brep]"
          # Auch hier die Constraints, und hier besonders: `constraints.txt`
          # nagelt `pyinstaller` und `pyinstaller-hooks-contrib` fest, und
          # gerade dessen Hooks entscheiden, welche Metadaten und Datendateien
          # ins Paket wandern. Ein Bauwerkzeug von morgen kann anderes
          # einpacken als das von heute, ohne dass sich eine Zeile Code ändert
          # — das war die einzige ungepinnte Installationszeile des Workflows.
          python -m pip install -c constraints.txt pyinstaller
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Rechen- und Prüfmodule kompilieren, Manifest signieren
        shell: python
        env:
          SOLIDON_STEP_NAME: "Rechen- und Prüfmodule kompilieren, Manifest signieren"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -c constraints.txt cython setuptools
          python tools/build_slice_core.py
          python tools/build_licence_module.py
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Bauen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Bauen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          pyinstaller packaging/solidon3d.spec --noconfirm
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '05', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: macOS-Grenze jeder Binärdatei und der Plist prüfen
        if: runner.os == 'macOS'
        shell: python
        env:
          SOLIDON_STEP_NAME: "macOS-Grenze jeder Binärdatei und der Plist prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/check_macos_floor.py dist/Solidon3D.app
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '06', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Hilfsprozess im Paket starten
        timeout-minutes: 5
        shell: python
        env:
          SOLIDON_STEP_NAME: "Hilfsprozess im Paket starten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/check_frozen_helper.py dist
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '07', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Anwendung im Paket starten
        timeout-minutes: 10
        shell: python
        env:
          SOLIDON_STEP_NAME: "Anwendung im Paket starten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python tools/check_frozen_start.py dist
          else
            python tools/check_frozen_start.py dist
          fi
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '08', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Linux-Grenze prüfen (glibc und Bibliotheken des Rechners)
        if: runner.os == 'Linux'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Linux-Grenze prüfen (glibc und Bibliotheken des Rechners)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/check_glibc_floor.py dist/Solidon3D
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '09', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Laufzeit-Stückliste gegen CycloneDX 1.6 prüfen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Laufzeit-Stückliste gegen CycloneDX 1.6 prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          $schemaUri = "https://raw.githubusercontent.com/CycloneDX/specification/55343ba19dee1785acf1ce9191540d5fd7b590db/schema/bom-1.6.schema.json"
          $schema = (Invoke-WebRequest -UseBasicParsing $schemaUri).Content
          $sbomPath = python -m tools.make_sbom --locate-artifact dist
          if ($LASTEXITCODE -ne 0) {
            throw "Die Stückliste liegt nicht genau einmal im Kundenartefakt. Paket neu bauen und PyInstaller-Datenliste prüfen."
          }
          # Auf macOS bleibt neben der .app ein COLLECT-Zwischenordner liegen.
          # Der Locator prüft nur die .app; Windows/Linux prüfen den finalen
          # COLLECT-Ordner. Eine zufällige zweite Kopie unter dist zählt nicht.
          $document = Get-Content -Raw -LiteralPath $sbomPath
          if (-not (Test-Json -Json $document -Schema $schema)) {
            throw "Solidon3D.cdx.json entspricht nicht dem offiziellen CycloneDX-1.6-Schema. Stückliste mit tools/make_sbom.py neu erzeugen."
          }
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '10', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Lizenzbeilage aus dem fertigen Kundenartefakt erzeugen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Lizenzbeilage aus dem fertigen Kundenartefakt erzeugen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          $sbomPath = python -m tools.make_sbom --locate-artifact dist
          if ($LASTEXITCODE -ne 0) { throw "Die Endartefakt-SBOM fehlt oder ist mehrdeutig." }
          $artifactRoot = if ($IsMacOS) { Resolve-Path "dist/Solidon3D.app" } else { Resolve-Path "dist/Solidon3D" }
          # **Auf macOS neben die ausführbare Datei, nicht in den Bundle-Root.**
          # Die Anwendung liest die Beilage neben sich (`licences._notice_file`:
          # `sys.executable.parent`), und das ist im Bundle `Contents/MacOS/` —
          # im Root fand der Über-Dialog sie bei 0.4.0 nie. Und ein Bundle mit
          # einer Datei neben `Contents/` lässt sich nicht signieren: Beim Bau
          # von 0.4.1 (13.09.2026, Lauf 34775201037) hielt `codesign` genau
          # daran an — „unsealed contents present in the bundle root".
          $noticePath = if ($IsMacOS) { Join-Path $artifactRoot "Contents/MacOS/THIRD-PARTY-NOTICES.md" } else { Join-Path $artifactRoot "THIRD-PARTY-NOTICES.md" }
          python -m tools.make_licence_notices `
            --sbom $sbomPath `
            --output $noticePath `
            --manifest build/third-party-licenses.json
          if ($LASTEXITCODE -ne 0) { throw "Die Lizenzbeilage konnte nicht aus der Endartefakt-SBOM erzeugt werden." }
          $manifest = Get-Content -Raw build/third-party-licenses.json | ConvertFrom-Json
          if ($manifest.schema -ne 2) { throw "Das CRA-Lizenzmanifest hat nicht Schema 2." }
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '11', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Prüfsummengebundene Signierübergabe erzeugen (Windows)
        if: runner.os == 'Windows'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Prüfsummengebundene Signierübergabe erzeugen (Windows)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/make_installer.py --signing-handoff
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '12', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Signiereingang packen (Windows)
        if: runner.os == 'Windows'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Signiereingang packen (Windows)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          $handoff = Get-Content -Raw packaging/build/windows-signing.json | ConvertFrom-Json
          $stage = Join-Path $env:RUNNER_TEMP "windows-signing-input"
          $archive = Join-Path $PWD "dist/windows-signing-input.zip"
          New-Item -ItemType Directory -Force "$stage/dist" | Out-Null
          New-Item -ItemType Directory -Force "$stage/packaging/build" | Out-Null
          Copy-Item -Recurse -LiteralPath $handoff.source_dir -Destination "$stage/dist"
          Copy-Item -LiteralPath $handoff.script, $handoff.licence, $handoff.icon -Destination "$stage/packaging"
          Copy-Item -LiteralPath packaging/build/licence.manifest, packaging/build/windows-signing.json -Destination "$stage/packaging/build"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal
          $sum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower()
          "$sum  windows-signing-input.zip" | Set-Content -Encoding ascii "dist/windows-signing-input.zip.sha256"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '13', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Signiereingang übergeben (Windows) (verschließen)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-windows-signing-input
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/14" <<'SOLIDON_PATHS'
          dist/windows-signing-input.zip
          dist/windows-signing-input.zip.sha256
          SOLIDON_PATHS
      - name: Signiereingang übergeben (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-windows-signing-input
          path: ${{ runner.temp }}/solidon-ci/boxes/14/
          if-no-files-found: error
          retention-days: 1
      - name: Archiv packen (Linux)
        if: runner.os == 'Linux'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Archiv packen (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/make_linux_packages.py --tarball
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '15', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Paketierwerkzeuge holen (Linux)
        if: runner.os == 'Linux'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Paketierwerkzeuge holen (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL --retry 3 -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum --check --strict
          curl -fsSL --retry 3 -o "$runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" | sha256sum --check --strict
          sudo install -m 755 "$tool" /usr/local/bin/appimagetool
          sudo install -m 644 "$runtime" /usr/local/lib/appimage-runtime-x86_64
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime-x86_64" >> "$GITHUB_ENV"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '16', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: AppImage bauen (Linux)
        if: runner.os == 'Linux'
        shell: python
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          SOLIDON_STEP_NAME: "AppImage bauen (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python tools/make_linux_packages.py --appimage
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '17', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Öffentliche Linux-Pakete prüfen
        if: runner.os == 'Linux'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Öffentliche Linux-Pakete prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          ls dist/*.AppImage >/dev/null
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '18', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: AppImage starten (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: python
        env:
          SOLIDON_STEP_NAME: "AppImage starten (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          appimage=$(ls dist/*.AppImage)
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python tools/check_frozen_start.py --executable "$appimage"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '19', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Bundle prüfen (macOS)
        if: runner.os == 'macOS'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Bundle prüfen (macOS)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          name=$(python -c "from app.branding import APP_NAME; print(APP_NAME)")
          test -d "dist/${name}.app" || { echo "::error::dist/${name}.app fehlt — BUNDLE hat nicht gegriffen."; exit 1; }
          test -x "dist/${name}.app/Contents/MacOS/${name}" || { echo "::error::Im Bundle fehlt die ausführbare Datei."; exit 1; }
          plutil -lint "dist/${name}.app/Contents/Info.plist"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '20', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Unsignierten macOS-App-Eingang packen
        if: runner.os == 'macOS'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Unsignierten macOS-App-Eingang packen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          name=$(python -c "from app.branding import APP_NAME; print(APP_NAME)")
          version=$(python -c "from app.branding import APP_VERSION; print(APP_VERSION)")
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${name}.app" "dist/${name}-${version}-macos-$(uname -m).zip"
          cd dist
          shasum -a 256 "${name}-${version}-macos-$(uname -m).zip" | tee "${name}-${version}-macos-$(uname -m).zip.sha256"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '21', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Prüfsummen (Linux)
        if: runner.os == 'Linux'
        shell: python
        env:
          SOLIDON_STEP_NAME: "Prüfsummen (Linux)"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          cd dist
          # Auch für das AppImage, und mit ``continue`` je Muster: Wer nur das
          # tar.gz hat, weil ein Paketierschritt scheiterte, soll dessen
          # Prüfsumme trotzdem bekommen.
          for pattern in "*-linux-x86_64.tar.gz" "*.AppImage"; do
            for archive in $pattern; do
              test -f "$archive" || continue
              sha256sum "$archive" | tee "$archive.sha256"
            done
          done
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '22', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Archiv hochladen (Linux) (verschließen)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-linux-release-input
          SOLIDON_IF_EMPTY: error
