        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-linux-flatpak-input
          SOLIDON_TARGET: release-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/03" --target "$SOLIDON_TARGET"
      - name: Releasebelege fail-closed prüfen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Releasebelege fail-closed prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          archive=$(find release-download -maxdepth 1 -type f -name 'Solidon3D-*-linux-x86_64.tar.gz')
          appimage=$(find release-download -maxdepth 1 -type f -name '*.AppImage')
          flatpak=$(find release-download -maxdepth 1 -type f -name '*.flatpak')
          [ -n "$archive" ] && [ -n "$appimage" ] && [ -n "$flatpak" ]
          for package in "$archive" "$appimage" "$flatpak"; do
            [ -f "$package.sha256" ]
            expected=$(awk '{print $1}' "$package.sha256")
            [ "$(sha256sum "$package" | awk '{print $1}')" = "$expected" ] || { echo "Geändertes Linux-Paket: $package"; exit 1; }
          done
          # `build/` gibt es hier nicht: Der Prüfjob checkt nur aus und lädt
          # Artefakte, gebaut wird woanders (Tag-Lauf 9, 03.09.2026).
          mkdir -p build
          cp "$appimage" "$flatpak" build/
          while IFS= read -r entry; do
            # Ein Verzeichniseintrag endet im tar auf einen Schrägstrich, und
            # aus `/$entry/` würde damit `//` — die Prüfung wies ihr eigenes
            # Archiv ab (Tag-Lauf 10, 03.09.2026). Die macOS-Prüfung daneben
            # schneidet ihn seit jeher ab; hier fehlte die Zeile.
            trimmed=${entry%/}
            case "/$trimmed/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$trimmed" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(tar -tzf "$archive")
          mkdir release-app
          tar -xzf "$archive" -C release-app
          artifact=$(find release-app -mindepth 2 -maxdepth 2 -type d -name Solidon3D)
          [ -n "$artifact" ] || { echo "Solidon3D-App-Baum fehlt im Linux-Archiv."; exit 1; }
          sbom=$(find "$artifact" -type f -name Solidon3D.cdx.json)
          [ "$(printf '%s\n' "$sbom" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || { echo "Die Linux-Endartefakt-SBOM fehlt oder ist mehrdeutig."; exit 1; }
          # **Das AppImage wird ausgepackt und für sich geprüft.** Sein Inhalt
          # trägt eine eigene Stückliste mit dem vorangestellten Laufzeitkern
          # (make_linux_packages.embed_appimage_runtime); Archiv und Flatpak
          # tragen ihn nicht. `--appimage-extract` ist eine Funktion des
          # Laufzeitkerns selbst und braucht kein FUSE.
          chmod +x "$appimage"
          appimage_file=$(readlink -f "$appimage")
          mkdir appimage-content
          ( cd appimage-content && "$appimage_file" --appimage-extract > /dev/null )
          appimage_root=appimage-content/squashfs-root/usr/bin
          [ -d "$appimage_root" ] || { echo "Der App-Baum fehlt im ausgepackten AppImage."; exit 1; }
          appimage_sbom=$(find "$appimage_root" -type f -name Solidon3D.cdx.json)
          [ "$(printf '%s\n' "$appimage_sbom" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || { echo "Die Stückliste des AppImage fehlt oder ist mehrdeutig."; exit 1; }
          # Die Linux-Grenze an den ausgelieferten Hüllen, nicht nur am Baum
          # des Paketjobs: Archiv und AppImage samt AppRun höchstens glibc
          # 2.35, ohne libstdc++ und libgcc_s (tools/check_glibc_floor.py).
          python tools/check_glibc_floor.py "$artifact"
          python tools/check_glibc_floor.py appimage-content/squashfs-root
          # Die Evidenz entsteht hier, wo äußere Pakete und SBOM zusammenliegen,
          # und wird gleich danach geprüft: Hashes der Pakete, Quellenangebote je
          # LGPL-Familie, Frist. Sie kommt aus der Stückliste des AppImage, der
          # größeren der beiden: Sie nennt zusätzlich den Laufzeitkern und
          # damit dessen Quellenangebot.
          # **Seit 0.5.0 blockiert die Releaseakte** (RM-115). Bis dahin meldete
          # sie nur (Entscheidung Robert, 02.09.2026), und im Tag-Lauf von
          # 0.4.4 war sie auf allen drei Plattformen rot, ohne dass es jemand
          # sah: pyinstaller fehlte hier, `_zstd.pyd` hatte keinen Besitzer,
          # und den Laufzeitkern des AppImage nannte keine Stückliste.
          python -m tools.make_licence_notices --write-evidence --sbom "$appimage_sbom" --release-evidence build/release-evidence.json \
            --package "appimage=build/$(basename "$appimage")" --package "flatpak=build/$(basename "$flatpak")"
          python -m tools.make_licence_notices --release-check --artifact-root "$artifact" --sbom "$sbom" --release-evidence build/release-evidence.json
          python -m tools.make_licence_notices --release-check --artifact-kind appimage --artifact-root "$appimage_root" --sbom "$appimage_sbom" --release-evidence build/release-evidence.json
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Geprüfte Linux-Pakete veröffentlichen (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-linux
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/05" <<'SOLIDON_PATHS'
          release-download/*.AppImage
          release-download/*.AppImage.sha256
          release-download/*.flatpak
          release-download/*.flatpak.sha256
          SOLIDON_PATHS
      - name: Geprüfte Linux-Pakete veröffentlichen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-linux
          path: ${{ runner.temp }}/solidon-ci/boxes/05/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-linux-release-check-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-linux-release-check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  windows-installer:
    name: Windows-Installer ohne Signierrechte bauen
    needs: [quelle, package]
    if: inputs.tests_only != true && (startsWith(github.event.inputs.ref, 'refs/tags/') || github.event.inputs.event == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Unsignierten App-Baum laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-windows-signing-input
          path: ${{ runner.temp }}/solidon-ci/loaded/01
      - name: Unsignierten App-Baum laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-windows-signing-input
          SOLIDON_TARGET: signing-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/01" --target "$SOLIDON_TARGET"
      - name: Vollständigen App-Baum prüfen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Vollständigen App-Baum prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          $ErrorActionPreference = 'Stop'
          $downloadRoot = (Resolve-Path "signing-download").Path
          $downloadFiles = @(Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Force)
          $downloadNames = @($downloadFiles | ForEach-Object { $_.FullName.Substring($downloadRoot.Length + 1).Replace('\','/') } | Sort-Object)
          if ($downloadNames.Count -ne 2 -or (Compare-Object $downloadNames @('windows-signing-input.zip', 'windows-signing-input.zip.sha256'))) { throw "Unbekannte Datei in der Windows-App-Übergabe." }
          $archive = (Resolve-Path "signing-download/windows-signing-input.zip").Path
          $line = (Get-Content -Raw "signing-download/windows-signing-input.zip.sha256").Trim()
          if ($line -notmatch '^([0-9a-f]{64})  windows-signing-input\.zip$') { throw "Ungültige Archiv-Prüfsumme." }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geändertes Übergabearchiv." }
          $root = [IO.Path]::GetFullPath((Join-Path $PWD "signing-input"))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          $entries = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName.TrimEnd('/')
              $parts = $name.Split('/')
              if (-not $name -or $entry.FullName.Contains('\') -or [IO.Path]::IsPathRooted($name) -or $parts -contains '' -or $parts -contains '.' -or $parts -contains '..' -or -not $entries.Add($name)) { throw "Unzulässiger oder doppelter Archivpfad: $($entry.FullName)" }
              $destination = [IO.Path]::GetFullPath((Join-Path $root $name))
              if (-not $destination.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Archivpfad verlässt das Ziel: $name" }
            }
          }
          finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $reparsePoints = @(Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          if ($reparsePoints) { throw "Die Windows-Übergabe enthält Verknüpfungen oder Reparse-Points." }
          $handoffPath = Join-Path $root "packaging/build/windows-signing.json"
          $handoff = Get-Content -Raw -LiteralPath $handoffPath | ConvertFrom-Json
          $fixed = @{
            application = "dist/Solidon3D/Solidon3D.exe"; source_dir = "dist/Solidon3D"; output_dir = "dist"
            script = "packaging/solidon3d.iss"; licence = "packaging/eula.txt"; icon = "packaging/solidon3d.ico"
            licence_manifest = "packaging/build/licence.manifest"
          }
          if ($handoff.schema_version -ne 1 -or $handoff.app_name -ne 'Solidon3D' -or $handoff.app_vendor -ne 'RS Digital' -or $handoff.app_id -ne 'de.rsdigital.solidon3d' -or $handoff.app_url -ne 'https://solidon3d.de/' -or $handoff.project_suffix -ne '.p3d' -or $handoff.part_file_suffix -ne '.solidon-part' -or $handoff.part_file_mime_type -ne 'application/vnd.solidon.part+json' -or $handoff.app_version -notmatch '^\d+\.\d+\.\d+$' -or $handoff.setup_filename -ne "Solidon3D-Setup-$($handoff.app_version).exe") { throw "Unbekannte Produktangaben in der Übergabe." }
          function Resolve-HandoffPath([string]$name) {
            if ([IO.Path]::IsPathRooted($name) -or $name.Contains('\') -or $name.Split('/') -contains '..') { throw "Unzulässiger Übergabepfad: $name" }
            $path = [IO.Path]::GetFullPath((Join-Path $root $name))
            if (-not $path.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Pfadausbruch: $name" }
            return $path
          }
          foreach ($name in $fixed.Keys) { if ($handoff.$name -ne $fixed[$name]) { throw "Unbekannter Produktpfad: $name" }; Resolve-HandoffPath $handoff.$name | Out-Null }
          $declared = @($handoff.input_sha256.PSObject.Properties.Name | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') } | Where-Object { $_ -ne 'packaging/build/windows-signing.json' } | Sort-Object)
          if (Compare-Object $declared $actual) { throw "Dateiliste und Übergabemanifest weichen voneinander ab." }
          foreach ($entry in $handoff.input_sha256.PSObject.Properties) {
            if ($entry.Value -notmatch '^[0-9a-f]{64}$') { throw "Ungültige Datei-Prüfsumme: $($entry.Name)" }
            $path = Resolve-HandoffPath $entry.Name
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { throw "Geänderter Signiereingang: $($entry.Name)" }
          }
          "SIGNING_ROOT=$root" >> $env:GITHUB_ENV
          "SIGNING_HANDOFF=$handoffPath" >> $env:GITHUB_ENV
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '02', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Installer aus der geprüften Übergabe bauen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Installer aus der geprüften Übergabe bauen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          # Version 7 vor 6, wie in tools/make_installer.py: Das Runner-Image trägt
          # heute 6, und das Skript läuft unter beiden. **Die Installationsorte
          # zuerst, der PATH zuletzt:** Auf dem Runner ist `ISCC` auf dem PATH
          # ein Chocolatey-Shim, und dessen Dateiversion ist „0.0.0.0 -
          # Chocolatey Shim: 1.0.0" — genau das stand im Protokoll von 0.4.4
          # (Lauf 35464068433) statt der Inno-Setup-Fassung.
          $compiler = @('C:\Program Files (x86)\Inno Setup 7\ISCC.exe', 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { $compiler = (Get-Command ISCC -ErrorAction SilentlyContinue).Source }
          if (-not $compiler) { throw "Inno Setup (7 oder 6) fehlt auf dem GitHub-Runner." }
          # **Welche Fassung gebaut hat, gehört ins Protokoll** (RM-055). Der
          # Griff oben nimmt, was da ist — heute 6, morgen 7 —, und bisher stand
          # nirgends, welche es war: weder ein Versionsaufruf vor dem Bau noch
          # ein Eintrag in der Releaseakte. Gelesen wird die Dateiversion und
          # nicht `ISCC` ohne Argumente: Der Aufruf gibt zwar den Banner aus,
          # endet aber mit einem Nichtnull-Code, und ein Schritt mit
          # `$LASTEXITCODE`-Prüfung daneben stürbe daran.
          # Die Fassung steht im Deinstallationseintrag, den der Inno-Installer
          # anlegt — nicht in der Datei: ISCC.exe trägt „0.0.0.0" (Inno Setup
          # 7.1.0 gemessen), und derselbe Weg steht in make_installer.compiler_version.
          $folder = (Split-Path -Parent (Resolve-Path -LiteralPath $compiler).Path).TrimEnd('\')
          $innoVersion = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -like 'Inno Setup *_is1' -and $_.InstallLocation -and $_.InstallLocation.TrimEnd('\') -ieq $folder } | Select-Object -First 1).DisplayVersion
          if ($innoVersion -notmatch '^[67]\.\d+') { throw "Die Inno-Setup-Fassung zu $compiler steht in keinem Deinstallationseintrag. Inno Setup mit seinem Installer einrichten." }
          Write-Host "Inno Setup: $compiler ($innoVersion)"
          if ($env:GITHUB_STEP_SUMMARY) {
            "Inno Setup: ``$compiler`` ($innoVersion)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          $handoff = Get-Content -Raw -LiteralPath $env:SIGNING_HANDOFF | ConvertFrom-Json
          & $compiler "/DAppName=Solidon3D" "/DAppVersion=$($handoff.app_version)" "/DAppPublisher=RS-Digital" "/DAppId=de.rsdigital.solidon3d" "/DAppUrl=https://solidon3d.de/" "/DProjectSuffix=.p3d" "/DPartFileSuffix=.solidon-part" "/DPartFileMimeType=application/vnd.solidon.part+json" "/DSourceDir=$(Join-Path $env:SIGNING_ROOT 'dist/Solidon3D')" "/DOutputDir=$(Join-Path $env:SIGNING_ROOT 'dist')" "/DLicenseFile=$(Join-Path $env:SIGNING_ROOT 'packaging/eula.txt')" "/DSetupIconFile=$(Join-Path $env:SIGNING_ROOT 'packaging/solidon3d.ico')" (Join-Path $env:SIGNING_ROOT "packaging/solidon3d.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup konnte den Installer nicht bauen." }
          $setup = Join-Path $env:SIGNING_ROOT "dist/$($handoff.setup_filename)"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Die exakt benannte Setup-Datei fehlt." }
          $sum = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower()
          "$sum  $($handoff.setup_filename)" | Set-Content -Encoding ascii "$setup.sha256"
          "ARTIFACT_SETUP=$setup" >> $env:GITHUB_ENV
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: source
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Installer still installieren und starten
        timeout-minutes: 15
        shell: python
        env:
          SOLIDON_STEP_NAME: "Installer still installieren und starten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'Solidon3D-installed'
          $log = Join-Path $env:RUNNER_TEMP 'setup-install.log'
          $process = Start-Process -FilePath $env:ARTIFACT_SETUP -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="' + $target + '"'), ('/LOG="' + $log + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 40; throw "Das Setup endete mit $($process.ExitCode)." }
          python source/tools/check_frozen_start.py --executable (Join-Path $target 'Solidon3D.exe')
          if ($LASTEXITCODE -ne 0) { throw "Der Starttest der installierten Anwendung ist rot." }
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Unsignierten Bau ausweisen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Unsignierten Bau ausweisen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          Write-Host "::warning::Unsignierter Prüfbau - nicht ausliefern. Nach der lokalen Anwendungssignatur baut windows-signed-installer.yml den Installer; seine Setup-Datei wird abschließend lokal signiert."
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '05', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Unsignierten finalen Installer intern übergeben (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-windows-final-private
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/06" <<'SOLIDON_PATHS'
          ${{ env.ARTIFACT_SETUP }}
          ${{ env.ARTIFACT_SETUP }}.sha256
          SOLIDON_PATHS
      - name: Unsignierten finalen Installer intern übergeben
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-windows-final-private
          path: ${{ runner.temp }}/solidon-ci/boxes/06/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-windows-installer-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-windows-installer-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  windows-release-check:
    name: Windows-Releaseakte prüfen
    needs: [quelle, windows-installer]
    if: inputs.tests_only != true && (success())
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Abhängigkeiten der Zielumgebung
        shell: python
        env:
          SOLIDON_STEP_NAME: "Abhängigkeiten der Zielumgebung"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -c constraints.txt -e ".[geom,ui,brep]" pyinstaller
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Finalen Installer laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-windows-final-private
          path: ${{ runner.temp }}/solidon-ci/loaded/02
      - name: Finalen Installer laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-windows-final-private
          SOLIDON_TARGET: release-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/02" --target "$SOLIDON_TARGET"
      - name: Unsignierten App-Baum laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-windows-signing-input
          path: ${{ runner.temp }}/solidon-ci/loaded/03
      - name: Unsignierten App-Baum laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-windows-signing-input
          SOLIDON_TARGET: app-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/03" --target "$SOLIDON_TARGET"
      - name: Releasebelege fail-closed prüfen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Releasebelege fail-closed prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          $archive = Resolve-Path app-download/windows-signing-input.zip
          $archiveLine = (Get-Content -Raw app-download/windows-signing-input.zip.sha256).Trim()
          if ($archiveLine -notmatch '^([0-9a-f]{64})  windows-signing-input\.zip$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geänderter Windows-App-Baum vor der Releaseprüfung." }
          Expand-Archive -LiteralPath $archive -DestinationPath release-app
          $artifactRoot = Resolve-Path release-app/dist/Solidon3D
          $sbom = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter "Solidon3D.cdx.json")
          if ($sbom.Count -ne 1) { throw "Die Windows-Endartefakt-SBOM fehlt oder ist mehrdeutig." }
          $sbomPath = $sbom[0].FullName
          $setup = @(Get-ChildItem release-download -File -Filter 'Solidon3D-Setup-*.exe')
          if ($setup.Count -ne 1 -or -not (Test-Path -LiteralPath "$($setup[0].FullName).sha256")) { throw "Finaler Windows-Installer fehlt oder ist mehrdeutig." }
          $setupLine = (Get-Content -Raw "$($setup[0].FullName).sha256").Trim()
          if ($setupLine -notmatch '^([0-9a-f]{64})  Solidon3D-Setup-\d+\.\d+\.\d+\.exe$' -or (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geänderter finaler Windows-Installer." }
          # `build/` gibt es hier nicht — siehe Linux-Prüfjob.
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item -LiteralPath $setup[0].FullName -Destination build/$($setup[0].Name)
          # **Seit 0.5.0 blockiert die Releaseakte** (RM-115) — siehe Linux-Prüfjob.
          python -m tools.make_licence_notices --write-evidence --sbom $sbomPath --release-evidence build/release-evidence.json --package "windows-installer=build/$($setup[0].Name)"
          if ($LASTEXITCODE -ne 0) { throw "Die Windows-Release-Evidenz wurde nicht geschrieben. Die Meldung darüber nennt den Grund." }
          python -m tools.make_licence_notices --release-check --artifact-root $artifactRoot --sbom $sbomPath --release-evidence build/release-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "Die Windows-Releasebelege sind unvollständig. Die Meldung darüber nennt den Grund." }
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'pwsh']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Geprüften Installer veröffentlichen (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-setup-windows
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/05" <<'SOLIDON_PATHS'
          release-download/*
          SOLIDON_PATHS
      - name: Geprüften Installer veröffentlichen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-setup-windows
          path: ${{ runner.temp }}/solidon-ci/boxes/05/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-windows-release-check-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-windows-release-check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  macos-app-sign:
    name: macOS-Anwendung signieren (${{ matrix.machine_arch }})
    needs: package
    if: >-
      inputs.tests_only != true && (
        (startsWith(github.event.inputs.ref, 'refs/tags/') || github.event.inputs.event == 'workflow_dispatch') &&
        (vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: production-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}
    steps:
      - name: Kistenwerkzeug bauen
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "$SOLIDON_REPOSITORY" ] || { echo "Läuft nur im Bau-Repository."; exit 1; }
          [[ "$SOLIDON_EVENT" =~ ^(push|workflow_dispatch)$ ]] && [[ "$SOLIDON_REF" =~ ^refs/(heads|tags)/[A-Za-z0-9._/-]{1,100}$ ]] && [[ "$SOLIDON_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$SOLIDON_NONCE" =~ ^[0-9a-f]{32}$ ]] || { echo "Ungültige Eingaben — mit tools/ci_relay.py starten."; exit 1; }
          state="$RUNNER_TEMP/solidon-ci"
          mkdir -p "$state/protocol" "$state/boxes" "$state/loaded"
          cat > "$state/box.swift" <<'SOLIDON_SWIFT'
          // Die Hülle des Bau-Repositorys für die Signierjobs auf dem Mac.
          //
          // Dieselbe Hülle wie in bau.py — AES-256-GCM in Blöcken, Nonce aus Präfix,
          // Blocknummer und Schlussbit, der Vorspann als authentisierte Angabe —, aber
          // ohne Python und ohne fremde Pakete: Ein Job mit entsperrtem Signierschlüssel
          // führt nur Apples eigene Werkzeuge aus, und CryptoKit gehört zum System.
          // bau.py crosscheck prüft beide Fassungen gegeneinander, bevor ein Signierjob
          // sie braucht.
          //
          //     box seal|open <art> <eingang> <ausgang>
          //
          // Schlüssel, Artefaktname, Commit und Lauf kommen aus der Umgebung
          // (SOLIDON_BAU_KEY, SOLIDON_ARTIFACT, SOLIDON_SHA, SOLIDON_NONCE).

          import CryptoKit
          import Foundation

          let magic = Data("SOLIDON-BAU-1\n".utf8)
          let block = 4 * 1024 * 1024
          let tagSize = 16
          let prefixSize = 7

          struct Refusal: Error {
              let message: String
          }

          func environment(_ name: String) throws -> String {
              guard let value = ProcessInfo.processInfo.environment[name], !value.isEmpty else {
                  throw Refusal(message: "\(name) fehlt — Schritt der Kiste prüfen.")
              }
              return value
          }

          func checked(_ value: String, _ what: String) throws -> String {
              let allowed = Set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-")
              guard !value.isEmpty, value.count <= 200, value.allSatisfy({ allowed.contains($0) }) else {
                  throw Refusal(message: "Ungültige Angabe für \(what) — Aufruf prüfen.")
              }
              return value
          }

          func nibble(_ character: UInt8) -> UInt8? {
              switch character {
              case 48...57: return character - 48
              case 97...102: return character - 87
              default: return nil
              }
          }

          func hexData(_ text: String) -> Data? {
              let characters = Array(text.utf8)
              guard characters.count % 2 == 0 else { return nil }
              var bytes = [UInt8]()
              var index = 0
              while index < characters.count {
                  guard let high = nibble(characters[index]), let low = nibble(characters[index + 1]) else {
                      return nil
                  }
                  bytes.append(high << 4 | low)
                  index += 2
              }
              return Data(bytes)
          }

          func hexString(_ data: Data) -> String {
              return data.map { String(format: "%02x", $0) }.joined()
          }

          func nonce(_ prefix: Data, _ index: UInt32, _ last: Bool) throws -> AES.GCM.Nonce {
              var bytes = prefix
              withUnsafeBytes(of: index.bigEndian) { bytes.append(contentsOf: $0) }
              bytes.append(last ? 1 : 0)
              return try AES.GCM.Nonce(data: bytes)
          }

          func readExactly(_ handle: FileHandle, _ count: Int) throws -> Data {
              var data = Data()
              while data.count < count {
                  guard let chunk = try handle.read(upToCount: count - data.count), !chunk.isEmpty else {
                      break
                  }
                  data.append(chunk)
              }
              return data
          }

          func writer(_ url: URL) throws -> FileHandle {
              guard FileManager.default.createFile(atPath: url.path, contents: nil) else {
                  throw Refusal(message: "\(url.path) lässt sich nicht anlegen.")
              }
              return try FileHandle(forWritingTo: url)
          }

          func sealBox(input: URL, output: URL, kind: String, name: String, commit: String, run: String, key: SymmetricKey) throws {
              let reader = try FileHandle(forReadingFrom: input)
              defer { try? reader.close() }
              let target = try writer(output)
              defer { try? target.close() }
              var generator = SystemRandomNumberGenerator()
              let prefix = Data((0..<prefixSize).map { _ in UInt8.random(in: 0...255, using: &generator) })
              let fields = "{\"block\":\(block),\"commit\":\"\(commit)\",\"format\":1,\"kind\":\"\(kind)\","
                  + "\"name\":\"\(name)\",\"prefix\":\"\(hexString(prefix))\",\"run\":\"\(run)\"}"
              let header = Data(fields.utf8)
              var associated = magic
              withUnsafeBytes(of: UInt32(header.count).bigEndian) { associated.append(contentsOf: $0) }
              associated.append(header)
              try target.write(contentsOf: associated)
              var index: UInt32 = 0
              var current = try readExactly(reader, block)
              while true {
                  var following = Data()
                  if current.count == block {
                      following = try readExactly(reader, block)
                  }
                  let last = following.isEmpty
                  let chunkNonce = try nonce(prefix, index, last)
                  let box = try AES.GCM.seal(current, using: key, nonce: chunkNonce, authenticating: associated)
                  try target.write(contentsOf: box.ciphertext)
                  try target.write(contentsOf: box.tag)
                  if last {
                      return
                  }
                  current = following
                  index += 1
              }
          }

          func openBox(input: URL, output: URL, kind: String, name: String, commit: String, run: String, key: SymmetricKey) throws {
              let reader = try FileHandle(forReadingFrom: input)
              defer { try? reader.close() }
              let head = try readExactly(reader, magic.count + 4)
              guard head.count == magic.count + 4, Data(head.prefix(magic.count)) == magic else {
                  throw Refusal(message: "Keine Solidon-Hülle — Datei und Artefakt prüfen.")
              }
              let size = Data(head.suffix(4)).reduce(0) { $0 << 8 | Int($1) }
              guard size > 0, size <= 4096 else {
                  throw Refusal(message: "Der Kopf der Hülle ist beschädigt — Artefakt neu erzeugen.")
              }
              let header = try readExactly(reader, size)
              guard header.count == size,
                    let fields = try JSONSerialization.jsonObject(with: header) as? [String: Any],
                    (fields["format"] as? Int) == 1,
                    (fields["block"] as? Int) == block,
                    let prefixText = fields["prefix"] as? String,
                    let prefix = hexData(prefixText), prefix.count == prefixSize
              else {
                  throw Refusal(message: "Der Kopf der Hülle ist beschädigt — Artefakt neu erzeugen.")
              }
              guard (fields["kind"] as? String) == kind, (fields["name"] as? String) == name,
                    (fields["commit"] as? String) == commit, (fields["run"] as? String) == run
              else {
                  throw Refusal(message: "Die Hülle gehört zu einem anderen Artefakt, Commit oder Lauf.")
              }
              let associated = head + header
              let target = try writer(output)
              defer { try? target.close() }
              var index: UInt32 = 0
              var current = try readExactly(reader, block + tagSize)
              while true {
                  var following = Data()
                  if current.count == block + tagSize {
                      following = try readExactly(reader, block + tagSize)
                  }
                  let last = following.isEmpty
                  guard current.count >= tagSize else {
                      throw Refusal(message: "Die Hülle ist abgeschnitten — Artefakt neu erzeugen.")
                  }
                  let chunkNonce = try nonce(prefix, index, last)
                  let plain: Data
                  do {
                      let sealed = try AES.GCM.SealedBox(
                          nonce: chunkNonce,
                          ciphertext: Data(current.prefix(current.count - tagSize)),
                          tag: Data(current.suffix(tagSize))
                      )
                      plain = try AES.GCM.open(sealed, using: key, authenticating: associated)
                  } catch {
                      throw Refusal(message: "Die Hülle ist verändert oder mit einem anderen Schlüssel verschlossen.")
                  }
                  try target.write(contentsOf: plain)
                  if last {
                      return
                  }
                  current = following
                  index += 1
              }
          }

          do {
              let arguments = CommandLine.arguments
              guard arguments.count == 5, arguments[1] == "seal" || arguments[1] == "open" else {
                  throw Refusal(message: "Aufruf: box seal|open <art> <eingang> <ausgang>")
              }
              let keyText = try environment("SOLIDON_BAU_KEY")
                  .trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
              guard keyText.count == 64, let keyData = hexData(keyText) else {
                  throw Refusal(message: "Der Schlüssel ist kein 64-stelliger Hexwert.")
              }
              let key = SymmetricKey(data: keyData)
              let kind = try checked(arguments[2], "Art")
              let name = try checked(try environment("SOLIDON_ARTIFACT"), "Artefakt")
              let commit = try checked(try environment("SOLIDON_SHA"), "Commit")
              let run = try checked(try environment("SOLIDON_NONCE"), "Lauf")
              let input = URL(fileURLWithPath: arguments[3])
              let output = URL(fileURLWithPath: arguments[4])
              if arguments[1] == "seal" {
                  try sealBox(input: input, output: output, kind: kind, name: name, commit: commit, run: run, key: key)
              } else {
                  try openBox(input: input, output: output, kind: kind, name: name, commit: commit, run: run, key: key)
              }
          } catch let refusal as Refusal {
              FileHandle.standardError.write(Data(("Angehalten: " + refusal.message + "\n").utf8))
              exit(1)
          } catch {
              FileHandle.standardError.write(Data("Angehalten: \(error)\n".utf8))
              exit(1)
          }
          SOLIDON_SWIFT
          swiftc -O -o "$state/box" "$state/box.swift" > "$state/protocol/00-swift.log" 2>&1
          {
            echo "SOLIDON_STATE=$state"
            echo "SOLIDON_BOX=$state/box"
            echo "SOLIDON_DEADLINE=$(( $(date +%s) + 6600 ))"
            echo "SOLIDON_EVENT=$SOLIDON_EVENT"
            echo "SOLIDON_REF=$SOLIDON_REF"
            echo "SOLIDON_SHA=$SOLIDON_SHA"
            echo "SOLIDON_NONCE=$SOLIDON_NONCE"
          } >> "$GITHUB_ENV"
          echo "Kistenwerkzeug bereit."
      - name: Gebundenen App-Baum laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/01
      - name: Gebundenen App-Baum laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          SOLIDON_TARGET: app-input
        run: |
          set -euo pipefail
          box=$(find "$SOLIDON_STATE/loaded/01" -type f -name '*.box')
          [ -n "$box" ] && [ "$(printf '%s\n' "$box" | wc -l | tr -d ' ')" = 1 ] || { echo "Nicht genau eine Hülle im Artefakt."; exit 1; }
          "$SOLIDON_BOX" open artifact "$box" "$SOLIDON_STATE/01.tar"
          mkdir -p "$SOLIDON_TARGET"
          tar -xf "$SOLIDON_STATE/01.tar" -C "$SOLIDON_TARGET"
          echo "Artefakt geöffnet: $(tar -tf "$SOLIDON_STATE/01.tar" | wc -l | tr -d ' ') Einträge"
          rm -f "$SOLIDON_STATE/01.tar"
      - name: App-Baum vor Schlüsselimport unveränderlich prüfen
        timeout-minutes: 110
        shell: bash
        env:
          SOLIDON_STEP_NAME: "App-Baum vor Schlüsselimport unveränderlich prüfen"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-02.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          files=$(find app-input -mindepth 1 -type f | wc -l | tr -d ' ')
          directories=$(find app-input -mindepth 1 -type d | wc -l | tr -d ' ')
          [ "$files" = 2 ] && [ "$directories" = 0 ] || { echo "Unbekannte Dateien in der macOS-App-Übergabe."; exit 1; }
          archive=$(find app-input -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.zip")
          [ -n "$archive" ] && [ -f "$archive.sha256" ] || { echo "Gebundener App-Baum fehlt."; exit 1; }
          checksum=$(cat "$archive.sha256")
          [[ "$checksum" =~ ^([0-9a-f]{64})[[:space:]][[:space:]]Solidon3D-[0-9]+\.[0-9]+\.[0-9]+-macos-${{ matrix.machine_arch }}\.zip$ ]] || { echo "Ungültige App-Prüfsumme."; exit 1; }
          [ "$(shasum -a 256 "$archive" | awk '{print $1}')" = "${BASH_REMATCH[1]}" ] || { echo "Geänderter App-Baum."; exit 1; }
          while IFS= read -r entry; do
            trimmed=${entry%/}
            case "/$trimmed/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$trimmed" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(zipinfo -1 "$archive")
          mkdir app-stage
          ditto -x -k "$archive" app-stage
          [ -d app-stage/Solidon3D.app ] || { echo "Solidon3D.app fehlt."; exit 1; }
          [ "$(find app-stage -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1 ] || { echo "Unbekanntes Produkt im App-Archiv."; exit 1; }
          /usr/bin/perl -MFile::Find -MCwd=abs_path -e '$root=abs_path($ARGV[0]); find({no_chdir=>1,wanted=>sub{return unless -l $File::Find::name; $path=abs_path($File::Find::name); die "Symlink verlässt App-Baum\n" unless defined($path) && index($path, "$root/")==0}},$root)' app-stage/Solidon3D.app
          plist=app-stage/Solidon3D.app/Contents/Info.plist
          [ "$(plutil -extract CFBundleIdentifier raw "$plist")" = "de.rsdigital.solidon3d" ]
          [ "$(plutil -extract CFBundleName raw "$plist")" = "Solidon3D" ]
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          lipo -archs app-stage/Solidon3D.app/Contents/MacOS/Solidon3D | tr ' ' '\n' | grep -x '${{ matrix.machine_arch }}' > /dev/null
          printf 'ARTIFACT_APP=%s\n' "$PWD/app-stage/Solidon3D.app" >> "$GITHUB_ENV"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/02.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/02-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-02.sh" >> "$SOLIDON_STATE/protocol/02.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/02.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 02: Exit $status"
          echo "Schritt 02: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: App mit Developer-ID signieren und Schlüssel wieder sperren
        timeout-minutes: 110
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SOLIDON_STEP_NAME: "App mit Developer-ID signieren und Schlüssel wieder sperren"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-03.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          keychain="$RUNNER_TEMP/solidon-app.keychain-db"
          certificate="$RUNNER_TEMP/solidon-app.p12"
          password=$(uuidgen)
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$certificate"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # **In die Suchliste, sonst sucht das Signierwerkzeug woanders.**
          # `security find-identity` fragt den genannten Schlüsselbund; `codesign`
          # und `productsign` suchen ihre Identität über die Suchliste des
          # Nutzers, und `--keychain` engt die nur ein, statt sie zu ersetzen.
          # Beim Bau von 0.4.1 (13.09.2026, Lauf 34771691630) stand die
          # Identität deshalb sauber im Schlüsselbund („1 identity imported")
          # und `codesign` antwortete auf ihren Fingerabdruck „no identity
          # found". Apples Anleitung für Runner endet mit genau dieser Zeile;
          # `delete-keychain` beim Aufräumen nimmt den Eintrag wieder heraus.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Signiert wird mit dem Fingerabdruck aus dem Schlüsselbund, den
          # dieser Schritt gerade selbst angelegt hat — nicht mit einem
          # Zertifikatsnamen aus einem Geheimnis. Am 10.09.2026 ist der Bau von
          # 0.4.0 auf beiden Architekturen genau daran gescheitert: Das
          # Zertifikat kam sauber herein („1 identity imported"), gesucht wurde
          # es unter dem Namen aus einem zweiten Geheimnis, und dieser Name
          # stand so nicht im Schlüsselbund („no identity found"). Ein Name, den
          # zwei Stellen unabhängig voneinander führen, geht irgendwann
          # auseinander; der Fingerabdruck steht nur an einer Stelle.
          # Gelesen wird Fingerabdruck **und** Name aus derselben Zeile. Der Name
          # ist nicht Zierat: Mit dem Geheimnis ist auch die Typprüfung
          # weggefallen, die vorher nebenbei mitlief — „Developer ID
          # Application: …" stand darin, und ein anderes Zertifikat wurde
          # schlicht nicht gefunden. Ohne diese Zeile signierte ein
          # versehentlich eingespieltes „Apple Development"-Zertifikat still
          # mit, und nichts danach fängt es: `codesign --verify` prüft die
          # Integrität der Signatur, nicht ihre Autorität, und `spctl` läuft
          # nur im Modus `notarized`.
          lines=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*\([0-9A-Fa-f]\{40\}[[:space:]].*\)$/\1/p')
          found=$(printf '%s\n' "$lines" | grep -c . || true)
          if [ "$found" -ne 1 ]; then
            echo "Im eigenen Schlüsselbund liegt nicht genau eine Signieridentität, sondern $found."
            echo "Erwartet wird das eine Developer-ID-Application-Zertifikat aus APPLE_CERTIFICATE."
            echo "Bei 0: Zertifikat oder Passwort prüfen — oder das Zertifikat ist abgelaufen"
            echo "beziehungsweise seine Kette kam unvollständig an; -v sortiert beides aus."
            echo "Bei mehr als 1: APPLE_CERTIFICATE enthält mehr als ein Zertifikat mit privatem Schlüssel."
            security find-identity "$keychain" || true
            exit 1
          fi
          line=$(printf '%s\n' "$lines" | sed -n 1p)
          identity=${line%% *}
          name=${line#* }
          case "$name" in
            '"Developer ID Application:'*) ;;
            *) echo "Im Schlüsselbund liegt $name — erwartet wird ein Developer-ID-Application-Zertifikat."; exit 1 ;;
          esac
          # **Hardened Runtime mit genau zwei Ausnahmen, nur für das
          # Hauptprogramm.**
          # 1. `allow-unsigned-executable-memory`: CPythons `_ctypes` legt
          #    schon beim Laden eine libffi-Closure an (`_ctypes_mod_exec`),
          #    jeder ctypes- und cffi-Rückruf wieder; geladen wird es schon in
          #    PyInstallers Bootstrap. Auf Intel holte Apples libffi dafür
          #    anonymen Speicher mit PROT_EXEC, ohne die Berechtigung kreiste
          #    sie auf macOS 26 endlos (RM-104). Auf Apple Silicon nimmt sie
          #    laut Quelltext ihre Trampolintabelle und bräuchte die Ausnahme
          #    nicht; belegt ist das nicht, denn kein Runner zeigt den Fehler
          #    (SIP aus). Sie bleibt, bis ein so signierter Start ohne sie auf
          #    einem Apple-Silicon-Mac mit SIP grün war. `allow-jit` hülfe
          #    nicht, libffi fordert kein MAP_JIT an.
          # 2. `disable-library-validation`: Die 3D-Maus spricht auf dem Mac
          #    über das Framework des Herstellers
          #    (/Library/Frameworks/3DconnexionClient.framework, per ctypes
          #    geladen, app/ui/spacemouse.py), und das trägt die Team-ID von
          #    3Dconnexion. Mit Bibliotheksprüfung lehnt dyld es ab, und weil
          #    3DxWare das Gerät exklusiv hält, bleibt die Maus tot. Apple
          #    nennt Hardware mit Hersteller-Plug-in als Grund für genau diese
          #    Ausnahme („Notarizing macOS software before distribution“).
          # Die Runner zeigen beide Fehler nicht (SIP aus). Die Bibliotheken erben nichts
          # — `--deep` mit `--entitlements` hängte die Liste an jede Datei,
          # deshalb zwei Läufe.
          entitlements="$RUNNER_TEMP/solidon-app.entitlements"
          cat > "$entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$entitlements"
          codesign --force --deep --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$ARTIFACT_APP"
          codesign --force --options runtime --timestamp --entitlements "$entitlements" --keychain "$keychain" --sign "$identity" "$ARTIFACT_APP"
          codesign --verify --deep --strict --verbose=2 "$ARTIFACT_APP"
          # Zurückgelesen, nicht vorausgesetzt — beide Schlüssel mit Wert und
          # keiner mehr: Die erste ist ohne Gegenprobe nicht entbehrlich
          # (RM-104), ohne die zweite ist die 3D-Maus tot, jede weitere ist
          # ungeprüft.
          granted=$(codesign -d --entitlements - --xml "$ARTIFACT_APP" 2>/dev/null | tr -d '[:space:]') || granted=""
          case "$granted" in
            *'<key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>'*) ;;
            *) echo "Die signierte App trägt die Berechtigung für ausführbaren Speicher nicht (RM-104)."; exit 1 ;;
          esac
          case "$granted" in
            *'<key>com.apple.security.cs.disable-library-validation</key><true/>'*) ;;
            *) echo "Die signierte App trägt die Ausnahme von der Bibliotheksprüfung nicht — der 3D-Maus-Treiber lüde nicht."; exit 1 ;;
          esac
          keys=$(printf '%s' "$granted" | { grep -o '<key>' || true; } | wc -l | tr -d ' ')
          [ "$keys" = 2 ] || { echo "Die signierte App trägt $keys Berechtigungen statt genau zwei."; exit 1; }
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/03.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/03-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-03.sh" >> "$SOLIDON_STATE/protocol/03.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/03.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 03: Exit $status"
          echo "Schritt 03: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Signierte App bei Apple notarisieren
        if: env.MACOS_SIGNING_MODE == 'notarized'
        timeout-minutes: 110
        shell: bash
        env:
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SOLIDON_STEP_NAME: "Signierte App bei Apple notarisieren"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-04.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_APP" notarization.zip
          xcrun notarytool submit notarization.zip --apple-id "$APPLE_NOTARY_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$ARTIFACT_APP"
          xcrun stapler validate "$ARTIFACT_APP"
          spctl --assess --type execute --verbose=2 "$ARTIFACT_APP"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/04.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/04-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-04.sh" >> "$SOLIDON_STATE/protocol/04.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/04.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 04: Exit $status"
          echo "Schritt 04: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Freigegebenen App-Baum neu binden
        timeout-minutes: 110
        shell: bash
        env:
          SOLIDON_STEP_NAME: "Freigegebenen App-Baum neu binden"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-05.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          version=$(plutil -extract CFBundleShortVersionString raw "$ARTIFACT_APP/Contents/Info.plist")
          archive="Solidon3D-${version}-macos-${{ matrix.machine_arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_APP" "$archive"
          shasum -a 256 "$archive" | tee "$archive.sha256"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/05.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/05-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-05.sh" >> "$SOLIDON_STATE/protocol/05.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/05.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 05: Exit $status"
          echo "Schritt 05: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Freigegebenen App-Baum intern übergeben (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          SOLIDON_IF_EMPTY: error
        run: |
          set -euo pipefail
          folder=""
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            directory=$(dirname -- "$pattern")
            [ -n "$folder" ] || folder=$directory
            [ "$directory" = "$folder" ] || { echo "Muster in verschiedenen Ordnern."; exit 1; }
            for match in "$directory"/$(basename -- "$pattern"); do
              [ -f "$match" ] || continue
              name=$(basename -- "$match")
              known=0
              for file in ${files[@]+"${files[@]}"}; do [ "$file" != "$name" ] || known=1; done
              [ "$known" = 1 ] || files+=("$name")
            done
          done <<'SOLIDON_PATHS'
          Solidon3D-*-macos-*.zip
          Solidon3D-*-macos-*.zip.sha256
          SOLIDON_PATHS
          if [ "${#files[@]}" -eq 0 ]; then
            [ "$SOLIDON_IF_EMPTY" != error ] || { echo "Keine Dateien für das Artefakt."; exit 1; }
            echo "Keine Dateien."
            exit 0
          fi
          mkdir -p "$SOLIDON_STATE/boxes/06"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -cf "$SOLIDON_STATE/06.tar" -C "$folder" -- "${files[@]}"
          "$SOLIDON_BOX" seal artifact "$SOLIDON_STATE/06.tar" "$SOLIDON_STATE/boxes/06/$SOLIDON_ARTIFACT.box"
          rm -f "$SOLIDON_STATE/06.tar"
          echo "Artefakt verschlossen: ${#files[@]} Dateien"
      - name: Freigegebenen App-Baum intern übergeben
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/boxes/06/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-macos-app-sign-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_BOX:-}" ]; then
            mkdir -p "$SOLIDON_STATE/boxes/protocol"
            COPYFILE_DISABLE=1 tar --no-mac-metadata -cf "$SOLIDON_STATE/protocol.tar" -C "$SOLIDON_STATE/protocol" .
            "$SOLIDON_BOX" seal artifact "$SOLIDON_STATE/protocol.tar" "$SOLIDON_STATE/boxes/protocol/$SOLIDON_ARTIFACT.box"
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-macos-app-sign-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  macos-package:
    name: macOS-Installer ohne Signierrechte bauen (${{ matrix.machine_arch }})
    needs: [quelle, package, macos-app-sign]
    if: >-
      inputs.tests_only != true && (
      always() && needs.package.result == 'success' &&
      (((vars.MACOS_SIGNING_MODE == '' || vars.MACOS_SIGNING_MODE == 'unsigned') && needs.macos-app-sign.result == 'skipped') ||
       ((vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized') && needs.macos-app-sign.result == 'success')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Signierten App-Baum laden
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/01
      - name: Signierten App-Baum laden (öffnen)
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          SOLIDON_TARGET: app-input
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/01" --target "$SOLIDON_TARGET"
      - name: Unsignierten App-Baum laden
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/02
      - name: Unsignierten App-Baum laden (öffnen)
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          SOLIDON_TARGET: app-input
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/02" --target "$SOLIDON_TARGET"
      - name: Gebundenen App-Baum auspacken
        shell: python
        env:
          SOLIDON_STEP_NAME: "Gebundenen App-Baum auspacken"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          files=$(find app-input -mindepth 1 -type f | wc -l | tr -d ' ')
          directories=$(find app-input -mindepth 1 -type d | wc -l | tr -d ' ')
          [ "$files" = 2 ] && [ "$directories" = 0 ] || { echo "Unbekannte Dateien in der macOS-App-Übergabe."; exit 1; }
          archive=$(find app-input -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.zip")
          [ -n "$archive" ] && [ -f "$archive.sha256" ]
          checksum=$(cat "$archive.sha256")
          [[ "$checksum" =~ ^([0-9a-f]{64})[[:space:]][[:space:]]Solidon3D-[0-9]+\.[0-9]+\.[0-9]+-macos-${{ matrix.machine_arch }}\.zip$ ]]
          [ "$(shasum -a 256 "$archive" | awk '{print $1}')" = "${BASH_REMATCH[1]}" ] || { echo "Geänderter App-Baum."; exit 1; }
          while IFS= read -r entry; do
            trimmed=${entry%/}
            case "/$trimmed/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$trimmed" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(zipinfo -1 "$archive")
          ditto -x -k "$archive" dist
          [ -d dist/Solidon3D.app ]
          /usr/bin/perl -MFile::Find -MCwd=abs_path -e '$root=abs_path($ARGV[0]); find({no_chdir=>1,wanted=>sub{return unless -l $File::Find::name; $path=abs_path($File::Find::name); die "Symlink verlässt App-Baum\n" unless defined($path) && index($path, "$root/")==0}},$root)' dist/Solidon3D.app
          cp "$archive" "dist/$(basename "$archive")"
          cp "$archive.sha256" "dist/$(basename "$archive.sha256")"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Installationspaket bauen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Installationspaket bauen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          notarized=false
          [ "$MACOS_SIGNING_MODE" = notarized ] && notarized=true
          python -c 'import sys; from tools import make_macos_package as tool; tool.write_files(sys.argv[1], notarized=sys.argv[2] == "true"); raise SystemExit(tool.build(sys.argv[1]))' '${{ matrix.machine_arch }}' "$notarized"
          package=$(find dist -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [ -n "$package" ]
          shasum -a 256 "$package" | tee "$package.sha256"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '04', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Unsignierten finalen Mac-Bau intern übergeben (verschließen)
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/05" <<'SOLIDON_PATHS'
          dist/Solidon3D-*-macos-*.pkg
          dist/Solidon3D-*-macos-*.pkg.sha256
          SOLIDON_PATHS
      - name: Unsignierten finalen Mac-Bau intern übergeben
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/boxes/05/
          if-no-files-found: error
          retention-days: 1
      - name: Swift-Hülle gegenprüfen (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O -o "$SOLIDON_STATE/box" "$RUNNER_TEMP/solidon-bau/box.swift" > "$SOLIDON_STATE/protocol/00-swift.log" 2>&1
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" crosscheck --box "$SOLIDON_STATE/box"
      - name: Mac-Installer zur Signierung übergeben (verschließen)
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-installer-input-${{ matrix.runner_arch }}
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/06" <<'SOLIDON_PATHS'
          dist/Solidon3D-*-macos-*.pkg
          dist/Solidon3D-*-macos-*.pkg.sha256
          SOLIDON_PATHS
      - name: Mac-Installer zur Signierung übergeben
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-macos-installer-input-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/boxes/06/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-macos-package-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-macos-package-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  macos-installer-sign:
    name: macOS-Installer signieren (${{ matrix.machine_arch }})
    needs: macos-package
    if: inputs.tests_only != true && (vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: production-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}
    steps:
      - name: Kistenwerkzeug bauen
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "$SOLIDON_REPOSITORY" ] || { echo "Läuft nur im Bau-Repository."; exit 1; }
          [[ "$SOLIDON_EVENT" =~ ^(push|workflow_dispatch)$ ]] && [[ "$SOLIDON_REF" =~ ^refs/(heads|tags)/[A-Za-z0-9._/-]{1,100}$ ]] && [[ "$SOLIDON_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$SOLIDON_NONCE" =~ ^[0-9a-f]{32}$ ]] || { echo "Ungültige Eingaben — mit tools/ci_relay.py starten."; exit 1; }
          state="$RUNNER_TEMP/solidon-ci"
          mkdir -p "$state/protocol" "$state/boxes" "$state/loaded"
          cat > "$state/box.swift" <<'SOLIDON_SWIFT'
          // Die Hülle des Bau-Repositorys für die Signierjobs auf dem Mac.
          //
          // Dieselbe Hülle wie in bau.py — AES-256-GCM in Blöcken, Nonce aus Präfix,
          // Blocknummer und Schlussbit, der Vorspann als authentisierte Angabe —, aber
          // ohne Python und ohne fremde Pakete: Ein Job mit entsperrtem Signierschlüssel
          // führt nur Apples eigene Werkzeuge aus, und CryptoKit gehört zum System.
          // bau.py crosscheck prüft beide Fassungen gegeneinander, bevor ein Signierjob
          // sie braucht.
          //
          //     box seal|open <art> <eingang> <ausgang>
          //
          // Schlüssel, Artefaktname, Commit und Lauf kommen aus der Umgebung
          // (SOLIDON_BAU_KEY, SOLIDON_ARTIFACT, SOLIDON_SHA, SOLIDON_NONCE).

          import CryptoKit
          import Foundation

          let magic = Data("SOLIDON-BAU-1\n".utf8)
          let block = 4 * 1024 * 1024
          let tagSize = 16
          let prefixSize = 7

          struct Refusal: Error {
              let message: String
          }

          func environment(_ name: String) throws -> String {
              guard let value = ProcessInfo.processInfo.environment[name], !value.isEmpty else {
                  throw Refusal(message: "\(name) fehlt — Schritt der Kiste prüfen.")
              }
              return value
          }

          func checked(_ value: String, _ what: String) throws -> String {
              let allowed = Set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-")
              guard !value.isEmpty, value.count <= 200, value.allSatisfy({ allowed.contains($0) }) else {
                  throw Refusal(message: "Ungültige Angabe für \(what) — Aufruf prüfen.")
              }
              return value
          }

          func nibble(_ character: UInt8) -> UInt8? {
              switch character {
              case 48...57: return character - 48
              case 97...102: return character - 87
              default: return nil
              }
          }

          func hexData(_ text: String) -> Data? {
              let characters = Array(text.utf8)
              guard characters.count % 2 == 0 else { return nil }
              var bytes = [UInt8]()
              var index = 0
              while index < characters.count {
                  guard let high = nibble(characters[index]), let low = nibble(characters[index + 1]) else {
                      return nil
                  }
                  bytes.append(high << 4 | low)
                  index += 2
              }
              return Data(bytes)
          }

          func hexString(_ data: Data) -> String {
              return data.map { String(format: "%02x", $0) }.joined()
          }

          func nonce(_ prefix: Data, _ index: UInt32, _ last: Bool) throws -> AES.GCM.Nonce {
              var bytes = prefix
              withUnsafeBytes(of: index.bigEndian) { bytes.append(contentsOf: $0) }
              bytes.append(last ? 1 : 0)
              return try AES.GCM.Nonce(data: bytes)
          }

          func readExactly(_ handle: FileHandle, _ count: Int) throws -> Data {
              var data = Data()
              while data.count < count {
                  guard let chunk = try handle.read(upToCount: count - data.count), !chunk.isEmpty else {
                      break
                  }
                  data.append(chunk)
              }
              return data
          }

          func writer(_ url: URL) throws -> FileHandle {
              guard FileManager.default.createFile(atPath: url.path, contents: nil) else {
                  throw Refusal(message: "\(url.path) lässt sich nicht anlegen.")
              }
              return try FileHandle(forWritingTo: url)
          }

          func sealBox(input: URL, output: URL, kind: String, name: String, commit: String, run: String, key: SymmetricKey) throws {
              let reader = try FileHandle(forReadingFrom: input)
              defer { try? reader.close() }
              let target = try writer(output)
              defer { try? target.close() }
              var generator = SystemRandomNumberGenerator()
              let prefix = Data((0..<prefixSize).map { _ in UInt8.random(in: 0...255, using: &generator) })
              let fields = "{\"block\":\(block),\"commit\":\"\(commit)\",\"format\":1,\"kind\":\"\(kind)\","
                  + "\"name\":\"\(name)\",\"prefix\":\"\(hexString(prefix))\",\"run\":\"\(run)\"}"
              let header = Data(fields.utf8)
              var associated = magic
              withUnsafeBytes(of: UInt32(header.count).bigEndian) { associated.append(contentsOf: $0) }
              associated.append(header)
              try target.write(contentsOf: associated)
              var index: UInt32 = 0
              var current = try readExactly(reader, block)
              while true {
                  var following = Data()
                  if current.count == block {
                      following = try readExactly(reader, block)
                  }
                  let last = following.isEmpty
                  let chunkNonce = try nonce(prefix, index, last)
                  let box = try AES.GCM.seal(current, using: key, nonce: chunkNonce, authenticating: associated)
                  try target.write(contentsOf: box.ciphertext)
                  try target.write(contentsOf: box.tag)
                  if last {
                      return
                  }
                  current = following
                  index += 1
              }
          }

          func openBox(input: URL, output: URL, kind: String, name: String, commit: String, run: String, key: SymmetricKey) throws {
              let reader = try FileHandle(forReadingFrom: input)
              defer { try? reader.close() }
              let head = try readExactly(reader, magic.count + 4)
              guard head.count == magic.count + 4, Data(head.prefix(magic.count)) == magic else {
                  throw Refusal(message: "Keine Solidon-Hülle — Datei und Artefakt prüfen.")
              }
              let size = Data(head.suffix(4)).reduce(0) { $0 << 8 | Int($1) }
              guard size > 0, size <= 4096 else {
                  throw Refusal(message: "Der Kopf der Hülle ist beschädigt — Artefakt neu erzeugen.")
              }
              let header = try readExactly(reader, size)
              guard header.count == size,
                    let fields = try JSONSerialization.jsonObject(with: header) as? [String: Any],
                    (fields["format"] as? Int) == 1,
                    (fields["block"] as? Int) == block,
                    let prefixText = fields["prefix"] as? String,
                    let prefix = hexData(prefixText), prefix.count == prefixSize
              else {
                  throw Refusal(message: "Der Kopf der Hülle ist beschädigt — Artefakt neu erzeugen.")
              }
              guard (fields["kind"] as? String) == kind, (fields["name"] as? String) == name,
                    (fields["commit"] as? String) == commit, (fields["run"] as? String) == run
              else {
                  throw Refusal(message: "Die Hülle gehört zu einem anderen Artefakt, Commit oder Lauf.")
              }
              let associated = head + header
              let target = try writer(output)
              defer { try? target.close() }
              var index: UInt32 = 0
              var current = try readExactly(reader, block + tagSize)
              while true {
                  var following = Data()
                  if current.count == block + tagSize {
                      following = try readExactly(reader, block + tagSize)
                  }
                  let last = following.isEmpty
                  guard current.count >= tagSize else {
                      throw Refusal(message: "Die Hülle ist abgeschnitten — Artefakt neu erzeugen.")
                  }
                  let chunkNonce = try nonce(prefix, index, last)
                  let plain: Data
                  do {
                      let sealed = try AES.GCM.SealedBox(
                          nonce: chunkNonce,
                          ciphertext: Data(current.prefix(current.count - tagSize)),
                          tag: Data(current.suffix(tagSize))
                      )
                      plain = try AES.GCM.open(sealed, using: key, authenticating: associated)
                  } catch {
                      throw Refusal(message: "Die Hülle ist verändert oder mit einem anderen Schlüssel verschlossen.")
                  }
                  try target.write(contentsOf: plain)
                  if last {
                      return
                  }
                  current = following
                  index += 1
              }
          }

          do {
              let arguments = CommandLine.arguments
              guard arguments.count == 5, arguments[1] == "seal" || arguments[1] == "open" else {
                  throw Refusal(message: "Aufruf: box seal|open <art> <eingang> <ausgang>")
              }
              let keyText = try environment("SOLIDON_BAU_KEY")
                  .trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
              guard keyText.count == 64, let keyData = hexData(keyText) else {
                  throw Refusal(message: "Der Schlüssel ist kein 64-stelliger Hexwert.")
              }
              let key = SymmetricKey(data: keyData)
              let kind = try checked(arguments[2], "Art")
              let name = try checked(try environment("SOLIDON_ARTIFACT"), "Artefakt")
              let commit = try checked(try environment("SOLIDON_SHA"), "Commit")
              let run = try checked(try environment("SOLIDON_NONCE"), "Lauf")
              let input = URL(fileURLWithPath: arguments[3])
              let output = URL(fileURLWithPath: arguments[4])
              if arguments[1] == "seal" {
                  try sealBox(input: input, output: output, kind: kind, name: name, commit: commit, run: run, key: key)
              } else {
                  try openBox(input: input, output: output, kind: kind, name: name, commit: commit, run: run, key: key)
              }
          } catch let refusal as Refusal {
              FileHandle.standardError.write(Data(("Angehalten: " + refusal.message + "\n").utf8))
              exit(1)
          } catch {
              FileHandle.standardError.write(Data("Angehalten: \(error)\n".utf8))
              exit(1)
          }
          SOLIDON_SWIFT
          swiftc -O -o "$state/box" "$state/box.swift" > "$state/protocol/00-swift.log" 2>&1
          {
            echo "SOLIDON_STATE=$state"
            echo "SOLIDON_BOX=$state/box"
            echo "SOLIDON_DEADLINE=$(( $(date +%s) + 6600 ))"
            echo "SOLIDON_EVENT=$SOLIDON_EVENT"
            echo "SOLIDON_REF=$SOLIDON_REF"
            echo "SOLIDON_SHA=$SOLIDON_SHA"
            echo "SOLIDON_NONCE=$SOLIDON_NONCE"
          } >> "$GITHUB_ENV"
          echo "Kistenwerkzeug bereit."
      - name: Gebundenen Installer laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-installer-input-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/01
      - name: Gebundenen Installer laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-installer-input-${{ matrix.runner_arch }}
          SOLIDON_TARGET: installer-input
        run: |
          set -euo pipefail
          box=$(find "$SOLIDON_STATE/loaded/01" -type f -name '*.box')
          [ -n "$box" ] && [ "$(printf '%s\n' "$box" | wc -l | tr -d ' ')" = 1 ] || { echo "Nicht genau eine Hülle im Artefakt."; exit 1; }
          "$SOLIDON_BOX" open artifact "$box" "$SOLIDON_STATE/01.tar"
          mkdir -p "$SOLIDON_TARGET"
          tar -xf "$SOLIDON_STATE/01.tar" -C "$SOLIDON_TARGET"
          echo "Artefakt geöffnet: $(tar -tf "$SOLIDON_STATE/01.tar" | wc -l | tr -d ' ') Einträge"
          rm -f "$SOLIDON_STATE/01.tar"
      - name: Exakten Installer vor Schlüsselimport prüfen
        timeout-minutes: 110
        shell: bash
        env:
          SOLIDON_STEP_NAME: "Exakten Installer vor Schlüsselimport prüfen"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-02.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          [ "$(find installer-input -mindepth 1 -type f | wc -l | tr -d ' ')" = 2 ]
          [ "$(find installer-input -mindepth 1 -type d | wc -l | tr -d ' ')" = 0 ]
          package=$(find installer-input -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [ -n "$package" ] && [ -f "$package.sha256" ]
          expected=$(awk '{print $1}' "$package.sha256")
          [ ${#expected} = 64 ] && [ "$(shasum -a 256 "$package" | awk '{print $1}')" = "$expected" ] || { echo "Geänderter Installer-Eingang."; exit 1; }
          printf 'ARTIFACT_PACKAGE=%s\n' "$PWD/$package" >> "$GITHUB_ENV"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/02.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/02-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-02.sh" >> "$SOLIDON_STATE/protocol/02.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/02.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 02: Exit $status"
          echo "Schritt 02: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Installer mit Developer-ID signieren und Schlüssel wieder sperren
        timeout-minutes: 110
        shell: bash
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SOLIDON_STEP_NAME: "Installer mit Developer-ID signieren und Schlüssel wieder sperren"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-03.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          keychain="$RUNNER_TEMP/solidon-installer.keychain-db"
          certificate="$RUNNER_TEMP/solidon-installer.p12"
          password=$(uuidgen)
          signed="$RUNNER_TEMP/signed.pkg"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$certificate" "$signed"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # **In die Suchliste, sonst sucht das Signierwerkzeug woanders.**
          # `security find-identity` fragt den genannten Schlüsselbund; `codesign`
          # und `productsign` suchen ihre Identität über die Suchliste des
          # Nutzers, und `--keychain` engt die nur ein, statt sie zu ersetzen.
          # Beim Bau von 0.4.1 (13.09.2026, Lauf 34771691630) stand die
          # Identität deshalb sauber im Schlüsselbund („1 identity imported")
          # und `codesign` antwortete auf ihren Fingerabdruck „no identity
          # found". Apples Anleitung für Runner endet mit genau dieser Zeile;
          # `delete-keychain` beim Aufräumen nimmt den Eintrag wieder heraus.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Wie bei der App der Fingerabdruck aus dem eigenen Schlüsselbund,
          # aber **ohne** `-p codesigning`: Eine Developer-ID-Installer-Identität
          # taucht unter dieser Richtlinie nicht auf, sie signiert Pakete und
          # keinen Code. Der Schlüsselbund gehört allein diesem Schritt, also
          # liegt darin genau das eine importierte Zertifikat.
          lines=$(security find-identity -v "$keychain" | sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*\([0-9A-Fa-f]\{40\}[[:space:]].*\)$/\1/p')
          found=$(printf '%s\n' "$lines" | grep -c . || true)
          if [ "$found" -ne 1 ]; then
            echo "Im eigenen Schlüsselbund liegt nicht genau eine Installeridentität, sondern $found."
            echo "Erwartet wird das eine Developer-ID-Installer-Zertifikat aus APPLE_INSTALLER_CERTIFICATE."
            echo "Bei 0: Zertifikat oder Passwort prüfen — oder das Zertifikat ist abgelaufen"
            echo "beziehungsweise seine Kette kam unvollständig an; -v sortiert beides aus."
            echo "Bei mehr als 1: APPLE_INSTALLER_CERTIFICATE enthält mehr als ein Zertifikat mit privatem Schlüssel."
            security find-identity "$keychain" || true
            exit 1
          fi
          line=$(printf '%s\n' "$lines" | sed -n 1p)
          name=${line#* }
          case "$name" in
            '"Developer ID Installer:'*) ;;
            *) echo "Im Schlüsselbund liegt $name — erwartet wird ein Developer-ID-Installer-Zertifikat."; exit 1 ;;
          esac
          # **Hier der Name und nicht der Fingerabdruck.** Für `codesign` ist der
          # 40-stellige Hash dokumentiert zulässig; für `productsign` sichert das
          # Handbuch dasselbe nicht in gleicher Weise zu, und ein Mac zum
          # Nachmessen steht hier nicht. Die Doppelquelle kommt dadurch nicht
          # zurück: Beides stammt aus derselben Zeile desselben Schlüsselbunds.
          quoted=${name#\"}
          productsign --sign "${quoted%\"}" --keychain "$keychain" "$ARTIFACT_PACKAGE" "$signed"
          pkgutil --check-signature "$signed"
          mv "$signed" "$ARTIFACT_PACKAGE"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/03.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/03-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-03.sh" >> "$SOLIDON_STATE/protocol/03.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/03.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 03: Exit $status"
          echo "Schritt 03: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Installer bei Apple notarisieren
        if: env.MACOS_SIGNING_MODE == 'notarized'
        timeout-minutes: 110
        shell: bash
        env:
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SOLIDON_STEP_NAME: "Installer bei Apple notarisieren"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-04.sh" <<'SOLIDON_STEP_END'
          set -euo pipefail
          xcrun notarytool submit "$ARTIFACT_PACKAGE" --apple-id "$APPLE_NOTARY_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$ARTIFACT_PACKAGE"
          xcrun stapler validate "$ARTIFACT_PACKAGE"
          spctl --assess --type install --verbose=2 "$ARTIFACT_PACKAGE"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/04.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/04-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-04.sh" >> "$SOLIDON_STATE/protocol/04.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/04.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 04: Exit $status"
          echo "Schritt 04: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Finalen Installer neu binden
        timeout-minutes: 110
        shell: bash
        env:
          SOLIDON_STEP_NAME: "Finalen Installer neu binden"
        run: |
          set -u
          cat > "$SOLIDON_STATE/step-05.sh" <<'SOLIDON_STEP_END'
          shasum -a 256 "$ARTIFACT_PACKAGE" | tee "$ARTIFACT_PACKAGE.sha256"
          SOLIDON_STEP_END
          status=0
          timed_out=0
          : > "$SOLIDON_STATE/protocol/05.log"
          GITHUB_SHA="$SOLIDON_SHA" GITHUB_REF="$SOLIDON_REF" GITHUB_EVENT_NAME="$SOLIDON_EVENT" GITHUB_STEP_SUMMARY="$SOLIDON_STATE/protocol/05-summary.md" bash --noprofile --norc -eo pipefail "$SOLIDON_STATE/step-05.sh" >> "$SOLIDON_STATE/protocol/05.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$SOLIDON_DEADLINE" ]; do
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Frist des Jobs erreicht; Schritt beendet." >> "$SOLIDON_STATE/protocol/05.log"
            timed_out=1
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi
          wait "$pid" || status=$?
          [ "$timed_out" = 0 ] || status=124
          echo "Schritt 05: Exit $status"
          echo "Schritt 05: Exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Finalen Mac-Bau intern übergeben (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          SOLIDON_IF_EMPTY: error
        run: |
          set -euo pipefail
          folder=""
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            directory=$(dirname -- "$pattern")
            [ -n "$folder" ] || folder=$directory
            [ "$directory" = "$folder" ] || { echo "Muster in verschiedenen Ordnern."; exit 1; }
            for match in "$directory"/$(basename -- "$pattern"); do
              [ -f "$match" ] || continue
              name=$(basename -- "$match")
              known=0
              for file in ${files[@]+"${files[@]}"}; do [ "$file" != "$name" ] || known=1; done
              [ "$known" = 1 ] || files+=("$name")
            done
          done <<'SOLIDON_PATHS'
          ${{ env.ARTIFACT_PACKAGE }}
          ${{ env.ARTIFACT_PACKAGE }}.sha256
          SOLIDON_PATHS
          if [ "${#files[@]}" -eq 0 ]; then
            [ "$SOLIDON_IF_EMPTY" != error ] || { echo "Keine Dateien für das Artefakt."; exit 1; }
            echo "Keine Dateien."
            exit 0
          fi
          mkdir -p "$SOLIDON_STATE/boxes/06"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -cf "$SOLIDON_STATE/06.tar" -C "$folder" -- "${files[@]}"
          "$SOLIDON_BOX" seal artifact "$SOLIDON_STATE/06.tar" "$SOLIDON_STATE/boxes/06/$SOLIDON_ARTIFACT.box"
          rm -f "$SOLIDON_STATE/06.tar"
          echo "Artefakt verschlossen: ${#files[@]} Dateien"
      - name: Finalen Mac-Bau intern übergeben
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/boxes/06/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-macos-installer-sign-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_BOX:-}" ]; then
            mkdir -p "$SOLIDON_STATE/boxes/protocol"
            COPYFILE_DISABLE=1 tar --no-mac-metadata -cf "$SOLIDON_STATE/protocol.tar" -C "$SOLIDON_STATE/protocol" .
            "$SOLIDON_BOX" seal artifact "$SOLIDON_STATE/protocol.tar" "$SOLIDON_STATE/boxes/protocol/$SOLIDON_ARTIFACT.box"
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-macos-installer-sign-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  macos-release-check:
    name: macOS-Releaseakte prüfen (${{ matrix.machine_arch }})
    needs: [quelle, macos-package, macos-installer-sign]
    if: >-
      inputs.tests_only != true && (
      always() && needs.macos-package.result == 'success' &&
      (((vars.MACOS_SIGNING_MODE == '' || vars.MACOS_SIGNING_MODE == 'unsigned') && needs.macos-installer-sign.result == 'skipped') ||
       ((vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized') && needs.macos-installer-sign.result == 'success')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Abhängigkeiten der Zielumgebung
        shell: python
        env:
          SOLIDON_STEP_NAME: "Abhängigkeiten der Zielumgebung"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -c constraints.txt -e ".[geom,ui,brep]" pyinstaller
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Finalen Installer laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/02
      - name: Finalen Installer laden (öffnen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          SOLIDON_TARGET: release-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/02" --target "$SOLIDON_TARGET"
      - name: Signierten App-Baum laden
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/03
      - name: Signierten App-Baum laden (öffnen)
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          SOLIDON_TARGET: app-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/03" --target "$SOLIDON_TARGET"
      - name: Unsignierten App-Baum laden
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/loaded/04
      - name: Unsignierten App-Baum laden (öffnen)
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          SOLIDON_TARGET: app-download
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" unpack --from "$RUNNER_TEMP/solidon-ci/loaded/04" --target "$SOLIDON_TARGET"
      - name: Releasebelege fail-closed prüfen
        shell: python
        env:
          SOLIDON_STEP_NAME: "Releasebelege fail-closed prüfen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          archive=$(find app-download -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.zip")
          [ -n "$archive" ] && [ -f "$archive.sha256" ]
          [ "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$(awk '{print $1}' "$archive.sha256")" ] || { echo "Geänderter finaler macOS-App-Baum."; exit 1; }
          mkdir release-app
          ditto -x -k "$archive" release-app
          package=$(find release-download -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [ -n "$package" ] && [ -f "$package.sha256" ]
          [ "$(shasum -a 256 "$package" | awk '{print $1}')" = "$(awk '{print $1}' "$package.sha256")" ] || { echo "Geänderter finaler macOS-Installer."; exit 1; }
          # `build/` gibt es hier nicht — siehe Linux-Prüfjob.
          mkdir -p build
          cp "$package" "build/$(basename "$package")"
          sbom=$(find release-app/Solidon3D.app -type f -name Solidon3D.cdx.json)
          [ "$(printf '%s\n' "$sbom" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || { echo "Die macOS-Endartefakt-SBOM fehlt oder ist mehrdeutig."; exit 1; }
          # **Seit 0.5.0 blockiert die Releaseakte** (RM-115) — siehe Linux-Prüfjob.
          python -m tools.make_licence_notices --write-evidence --sbom "$sbom" --release-evidence build/release-evidence.json --package "macos-installer=build/$(basename "$package")"
          python -m tools.make_licence_notices --release-check --artifact-root release-app/Solidon3D.app --sbom "$sbom" --release-evidence build/release-evidence.json
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '05', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Installiertes Paket starten
        timeout-minutes: 15
        shell: python
        env:
          SOLIDON_STEP_NAME: "Installiertes Paket starten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -euo pipefail
          package=$(find release-download -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [[ "$package" =~ Solidon3D-([0-9]+\.[0-9]+\.[0-9]+)-macos- ]]
          version=${BASH_REMATCH[1]}
          # Das Paket ist nicht umziehbar (tools/make_macos_package.py,
          # COMPONENT_SETTINGS): Sonst aktualisierte Apples Installer eine
          # Kopie derselben Kennung dort, wo sie liegt, und der Kunde startete
          # aus /Applications weiter die alte Version. Geprüft an der
          # PackageInfo des signierten Pakets und am Verhalten: Die
          # ausgepackte Prüfkopie unter release-app bleibt als solche Kopie
          # liegen, und die Installation muss trotzdem in /Applications landen.
          python tools/make_macos_package.py --check "$package"
          [ -d release-app/Solidon3D.app ] || { echo "Die Prüfkopie fehlt — der Umzugsfall bliebe ungeprüft."; exit 1; }
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$package"
          sudo installer -pkg "$package" -target /
          installed=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Solidon3D.app/Contents/Info.plist) || { echo "In /Applications liegt kein Solidon3D — das Paket hat eine andere Kopie aktualisiert."; exit 1; }
          [ "$installed" = "$version" ] || { echo "In /Applications liegt $installed statt $version."; exit 1; }
          rm -rf release-app
          if [ "$MACOS_SIGNING_MODE" != unsigned ]; then
            codesign --verify --deep --strict --verbose=2 /Applications/Solidon3D.app
          fi
          if [ "$MACOS_SIGNING_MODE" = notarized ]; then
            spctl --assess --type execute --verbose=2 /Applications/Solidon3D.app
          fi
          python tools/check_frozen_start.py --executable /Applications/Solidon3D.app
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '06', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Geprüften Mac-Bau veröffentlichen (verschließen)
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: solidon3d-macos-${{ matrix.runner_arch }}
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/07" <<'SOLIDON_PATHS'
          release-download/*
          app-download/*
          SOLIDON_PATHS
      - name: Geprüften Mac-Bau veröffentlichen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidon3d-macos-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/solidon-ci/boxes/07/
          if-no-files-found: error
          retention-days: 1
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-build-macos-release-check-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protokoll-build-macos-release-check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  latest:
    name: Neueste Versionen
    needs: [quelle]
    if: >-
