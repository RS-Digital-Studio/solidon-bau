# Erzeugt von tools/ci_relay.py aus .github/workflows/mutation.yml.
# Nicht von Hand bearbeiten; die Begründungen stehen in der Quelle.

name: Mutationstests
run-name: Solidon ${{ inputs.event }} ${{ inputs.ref }} ${{ inputs.sha }} ${{ inputs.selection }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      event:
        description: "Ereignis im Quellrepository"
        type: choice
        options: [push, workflow_dispatch]
        required: true
      ref:
        description: "Ref im Quellrepository"
        type: string
        required: true
      sha:
        description: "Commit im Quellrepository"
        type: string
        required: true
      package_asset:
        description: "Asset des verschlüsselten Pakets im Entwurf"
        type: string
        required: true
      nonce:
        description: "Kennung des Laufs, an die Paket und Artefakte gebunden sind"
        type: string
        required: true
      selection:
        description: "Herkunft der Fenster- und Slicerauswahl"
        type: choice
        options: [auto, manual]
        required: true
      module:
        description: "Ein Modul aus [tool.mutmut] only_mutate oder all"
        type: choice
        options: [all, app/core/units.py, app/core/expressions.py, app/core/knowledge/profiles.py]
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: solidon-bau
  cancel-in-progress: false

jobs:
  quelle:
    name: Quelle holen
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Paket aus dem Entwurf laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOLIDON_ASSET: ${{ inputs.package_asset }}
        run: |
          set -euo pipefail
          [[ "$SOLIDON_ASSET" =~ ^[1-9][0-9]*$ ]] || { echo "Ungültige Paketnummer."; exit 1; }
          folder="$RUNNER_TEMP/solidon-package"
          mkdir -p "$folder"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$SOLIDON_ASSET" > "$folder/source.box"
          echo "Paket: $(wc -c < "$folder/source.box" | tr -d ' ') Byte"
      - name: Paket an die Jobs geben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-package/source.box
          if-no-files-found: error
          retention-days: 1

  mutation:
    name: Mutationstests (Linux, Ziffern ${{ matrix.digits }})
    needs: [quelle]
    strategy:
      fail-fast: false
      matrix:
        digits: ["05", "16", "27", "38", "49"]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Bauwerkzeug holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .solidon-bau
          persist-credentials: false
          sparse-checkout: werkzeug
      - name: Python für das Bauwerkzeug
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Bauwerkzeug einrichten
        shell: bash
        env:
          SOLIDON_REPOSITORY: RS-Digital-Studio/solidon-bau
          SOLIDON_EVENT: ${{ github.event.inputs.event }}
          SOLIDON_REF: ${{ github.event.inputs.ref }}
          SOLIDON_SHA: ${{ github.event.inputs.sha }}
          SOLIDON_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/solidon-bau"
          mv .solidon-bau/werkzeug "$RUNNER_TEMP/solidon-bau"
          rm -rf .solidon-bau
          bash_path="$BASH"
          if command -v cygpath > /dev/null; then bash_path=$(cygpath -m "$BASH"); fi
          python "$RUNNER_TEMP/solidon-bau/bau.py" setup --bash "$bash_path" --minutes 120
      - name: Quelle laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solidon-quelle
          path: ${{ runner.temp }}/solidon-ci/package
      - name: Quelle entschlüsseln
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_INPUTS: ${{ toJSON(github.event.inputs) }}
          SOLIDON_TARGET: .
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" source --package "$RUNNER_TEMP/solidon-ci/package" --target "$SOLIDON_TARGET"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Qt-Systembibliotheken
        shell: python
        env:
          SOLIDON_STEP_NAME: "Qt-Systembibliotheken"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 \
            libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            fonts-dejavu-core fontconfig \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-glx0
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '01', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Abhängigkeiten
        shell: python
        env:
          SOLIDON_STEP_NAME: "Abhängigkeiten"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          python -m pip install -c constraints.txt -e ".[dev,geom,ui,brep,mutation]"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '02', '--shell', 'default']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Mutationen
        shell: python
        env:
          MUTATION_MODULE: ${{ inputs.module }}
          MUTATION_DIGITS: ${{ matrix.digits }}
          SOLIDON_STEP_NAME: "Mutationen"
        run: |
          import os
          import subprocess
          import sys

          script = r'''
          set -uo pipefail
          mkdir -p reports/mutation
          # Der Schritt endet zehn Minuten vor der Frist des Jobs (CI-06). mutmut hält
          # nach 90 Minuten an, damit Bericht und Ungetötete auch dann gesichert werden;
          # was bis dahin nicht lief, steht als `not checked` darin. Der erste Fehler
          # bestimmt den Ausgang, die Schritte danach laufen trotzdem.
          status=0
          keep() { if [ "$status" -eq 0 ]; then status=$1; fi; }
          # mutmut nimmt Mutantennamen mit Platzhalter, und jeder Name beginnt mit seinem
          # Modul in Punktschreibweise und endet mit seiner Nummer
          # (`app.core.units.x_clamp__mutmut_1`). Dieser Teil nimmt die Nummern mit den
          # Ziffern aus `digits` am Ende, in einem Modul oder in allen (`all`).
          module="${MUTATION_MODULE:-all}"
          prefix=""
          if [ "$module" != "all" ]; then
            prefix="$(printf '%s' "${module%.py}" | tr / .)."
          fi
          echo "$module" > reports/mutation/module.txt
          echo "$MUTATION_DIGITS" > reports/mutation/digits.txt
          python -m pip freeze --exclude-editable > reports/mutation/versions.txt || keep $?
          timeout -s INT -k 2m 90m mutmut run "${prefix}*[${MUTATION_DIGITS}]" || keep $?
          { mutmut export-cicd-stats && cp mutants/mutmut-cicd-stats.json reports/mutation/; } \
            || keep $?
          # Jeder Mutant dieses Teils mit seinem Ausgang. Die Statistik darüber zählt jedes
          # erzeugte Modul und jeden Teil mit; gezählt wird hier.
          mutmut results --all true \
            | { grep -F "    ${prefix}" || true; } \
            | { grep -E "__mutmut_[0-9]*[${MUTATION_DIGITS}]: " || true; } \
            > reports/mutation/all.txt || keep $?
          sed -E 's/^.*: //' reports/mutation/all.txt | sort | uniq -c \
            > reports/mutation/counts.txt || keep $?
          { grep -v ': killed$' reports/mutation/all.txt || true; } \
            > reports/mutation/results.txt || keep $?
          # Je gelaufene Mutation, die nicht getötet ist, die Änderung selbst: Sie sagt,
          # welcher Test fehlt. Nur `killed` gilt als getötet. Ungeprüfte (`not checked`,
          # `skipped`, Abbruch) stehen nur mit Namen in results.txt: Ein `mutmut show` je
          # Mutant über alle hielte den Schritt nach einem Abbruch über seine Frist.
          { grep -E ': (survived|timeout|suspicious|no tests|segfault|caught by type check)$' \
              reports/mutation/results.txt || true; } \
            | sed -E 's/^[[:space:]]*//; s/: [a-z ]+$//' \
            | while read -r mutant; do
                echo "== $mutant"
                mutmut show "$mutant"
              done > reports/mutation/survived.txt || keep $?
          # Vollständig ist ein Teil erst, wenn er jeden seiner Mutanten erreicht hat.
          unchecked="$(grep -c -E ': (not checked|skipped)$' reports/mutation/all.txt || true)"
          if [ ! -s reports/mutation/all.txt ]; then
            echo "Dieser Teil fand keinen Mutanten (${prefix}*[${MUTATION_DIGITS}])."
            keep 1
          elif [ "${unchecked:-0}" -gt 0 ]; then
            echo "${unchecked} Mutanten dieses Teils blieben ungeprüft: mehr Teile in digits."
            keep 1
          fi
          exit "$status"
          '''
          command = [os.environ['SOLIDON_PYTHON'], os.environ['SOLIDON_TOOL'], 'step',
                     '--number', '03', '--shell', 'bash']
          sys.exit(subprocess.run(command, input=script[1:].encode('utf-8')).returncode)
      - name: Bericht sichern (verschließen)
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: mutation-report-${{ matrix.digits }}
          SOLIDON_IF_EMPTY: error
          SOLIDON_HIDDEN: "false"
        run: |
          "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/04" <<'SOLIDON_PATHS'
          reports/mutation/
          SOLIDON_PATHS
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.digits }}
          path: ${{ runner.temp }}/solidon-ci/boxes/04/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Protokoll verschließen
        if: always()
        shell: bash
        env:
          SOLIDON_BAU_KEY: ${{ secrets.SOLIDON_BAU_KEY }}
          SOLIDON_ARTIFACT: protokoll-mutation-mutation-${{ strategy.job-index }}
          SOLIDON_IF_EMPTY: ignore
        run: |
          if [ -n "${SOLIDON_PYTHON:-}" ]; then
            "$SOLIDON_PYTHON" "$SOLIDON_TOOL" pack --box "$RUNNER_TEMP/solidon-ci/boxes/protocol" <<'SOLIDON_PATHS'
          ${{ runner.temp }}/solidon-ci/protocol/
          SOLIDON_PATHS
          fi
      - name: Protokoll sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protokoll-mutation-mutation-${{ strategy.job-index }}
          path: ${{ runner.temp }}/solidon-ci/boxes/protocol/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
